---
all:
  hosts:
    local:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"
      ansible_become_exe: >-
        {{ '/usr/bin/sudo.ws'
           if (ansible_facts['distribution'] == 'Ubuntu' and ansible_facts['distribution_version'] == '26.04')
           else '/usr/bin/sudo' }}
