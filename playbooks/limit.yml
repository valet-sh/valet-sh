#
# valet.sh | limit
#
# @author: "Philipp Dittert"
# @command: "limit"
# @platform: macOS Ubuntu
# @description: "Manage limit parameters | Usage: valet.sh limit <key> <value>"
# @usage: "valet.sh limit <key> <value>"
# @help:
#
# set: Sets a specific limit for a valet.sh service (cpus, memory)
# valet.sh limit cpus 2 <service_name>
# valet.sh limit memory 512M <service_name>
#
# get: Gets a specific limit for a valet.sh service
# valet.sh limit get <key> <service_name>
#
# remove: removes a specific limit for a valet.sh service
# valet.sh limit remove <key> <service_name>
#
---
- name: "limit"
  hosts: local
  gather_facts: true
  vars:
    valet_limit_action: "{{ cli.args[0] }}"
    valet_limit_key: "{{ cli.args[1] | default() }}"
    valet_limit_value: "{{ cli.args[2] | default() }}"
    valet_limit_service: "{{ cli.args[3] | default() }}"
  vars_prompt:
    - name: "ansible_become_pass"
      prompt: "[sudo] Password"
      private: true
  roles:
    - sudo-permission-check
    - valet-limit
