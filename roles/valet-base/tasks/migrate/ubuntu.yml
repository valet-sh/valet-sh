---

- name: "ensure all vsh systemd services are stopped"
  shell: "systemctl stop {{ item }}"
  with_items:
    - valkey8-server
    - rabbitmq-server
    - opensearch1
    - opensearch2
    - opensearch3
    - mysql57
    - mysql80
    - mysql84
    - mariadb104
    - mariadb106
    - mariadb1011
    - mariadb114
    - mailpit
    - elasticsearch1
    - elasticsearch2
    - elasticsearch5
    - elasticsearch6
    - elasticsearch7
    - elasticsearch8
  become: true
  ignore_errors: true

- name: "remove vsh systemd service files"
  file:
    path: "/etc/systemd/system/{{ item }}.service"
    state: absent
  with_items:
    - valkey8-server
    - opensearch1
    - opensearch2
    - opensearch3
    - mysql57
    - mysql80
    - mysql84
    - mariadb104
    - mariadb106
    - mariadb1011
    - mariadb114
    - mailpit
    - elasticsearch1
    - elasticsearch2
    - elasticsearch5
    - elasticsearch6
    - elasticsearch7
    - elasticsearch8
  become: true

- name: reload Systemd
  ansible.builtin.systemd:
    daemon_reload: true
  become: true

- name: ensure all vsh related apt packages are removed
  ansible.builtin.apt:
    name: "{{ packages }}"
    state: absent
    purge: true
  vars:
    packages:
      - php5.6-common
      - php7.0-common
      - php7.1-common
      - php7.2-common
      - php7.3-common
      - php7.4-common
      - php8.0-common
      - php8.1-common
      - php8.2-common
      - php8.3-common
      - php8.4-common
      - php8.5-common
      - redis-server
      - redis-tools
      - rabbitmq-server
  become: true

- name: "remove vsh related files in '/usr/local/bin/'"
  file:
    path: "/usr/local/bin/{{ item }}"
    state: absent
  with_items:
    - mysql
    - mysql5.7
    - mysql8.0
    - mysql8.4
    - mysqladmin
    - mysqladmin5.7
    - mysqladmin8.0
    - mysqladmin8.4
    - mariadb10.11
    - mariadb10.4
    - mariadb10.6
    - mariadb11.4
    - mariadump10.4
    - mariadump10.6
    - mariadump10.11
    - mariadump11.4
    - mariaadmin10.4
    - mariaadmin10.6
    - mariaadmin10.11
    - mariaadmin11.4
    - valkey8-cli
    - composer
    - composer1
    - default-composer
    - default-mysql
    - default-mysqladmin
    - default-mysqldump
    - mysqldump
    - mysqldump5.7
    - mysqldump8.0
    - mysqldump8.4
  become: true

- name: "remove vsh related files in '{{ current_home }}/'"
  file:
    path: "{{ current_home }}/{{ item }}"
    state: absent
  with_items:
    - .my10.4.cnf
    - .my10.6.cnf
    - .my10.11.cnf
    - .my11.4.cnf
    - .my5.7.cnf
    - .my8.0.cnf
    - .my8.4.cnf
    - .my.cnf
  become: true

- name: run 'mv /usr/local/valet-sh/packages /usr/local/valet-sh/packages-migrated-v2'
  ansible.builtin.shell:
    cmd: mv /usr/local/valet-sh/packages /usr/local/valet-sh/packages-migrated-v2
    executable: /bin/bash
  args:
    creates: /usr/local/valet-sh/packages-migrated-v2
  become: true

- name: "cleanup old links"
  when: valet_etc_links_file_obj.stat.exists
  block:
    - name: "| include variables from '{{ valet_etc_links_file }}' file"
      ansible.builtin.include_vars:
        file: "{{ valet_etc_links_file }}"
        name: valet_migrate_links

    - name: "ensure all old nginx vhost configs are deleted"
      file:
        path: "/etc/nginx/conf.d/{{ valet_migrate_links_valet_links_links_index_item }}.{{ dnsmasq_domain }}.conf"
        state: absent
      with_items: "{{ valet_migrate_links.valet_links.links_index }}"
      loop_control:
        loop_var: valet_migrate_links_valet_links_links_index_item
      become: true

    - name: "ensure '{{ valet_etc_links_file }}' is deleted"
      file:
        path: "{{ valet_etc_links_file }}"
        state: absent
      become: true

- name: "remove '{{ valet_etc_path }}/services.yml'"
  file:
    path: "{{ valet_etc_path }}/services.yml"
    state: absent
  become: true

- name: "remove '{{ valet_etc_path }}/.migrate-v2'"
  file:
    path: "{{ valet_etc_path }}/.migrate-v2"
    state: absent
  become: true
