---

- name: "ensure all brew services are stopped"
  shell: "sudo /usr/local/bin/brew_x86 services stop {{ item }}"
  with_items:
    - dnsmasq
    - nginx
  ignore_errors: true

- name: "ensure all brew services are stopped"
  shell: "/usr/local/bin/brew_x86 services stop {{ item }}"
  with_items:
    - mailpit
    - redis
    - vsh-elasticsearch1
    - vsh-elasticsearch2
    - vsh-elasticsearch5
    - vsh-elasticsearch6
    - vsh-elasticsearch7
    - vsh-elasticsearch8
    - vsh-mariadb1011
    - vsh-mariadb104
    - vsh-mariadb106
    - vsh-mariadb114
    - vsh-mysql57
    - vsh-mysql80
    - vsh-mysql84
    - vsh-opensearch1
    - vsh-opensearch2
    - vsh-opensearch3
    - vsh-php56
    - vsh-php70
    - vsh-php71
    - vsh-php72
    - vsh-php73
    - vsh-php74
    - vsh-php80
    - vsh-php81
    - vsh-php82
    - vsh-php83
    - vsh-php84
    - vsh-php85
    - vsh-valkey8
  ignore_errors: true

- name: ensure brew_x86 is uninstalled
  ansible.builtin.shell:
    cmd: |
      set -eu
      eval "$(/usr/local/bin/brew shellenv)"
      arch -x86_64 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/uninstall.sh)" -- --force
    executable: /bin/bash
  ignore_errors: true

- name: "ensure all brew services are stopped"
  shell: "/opt/homebrew/bin/brew services stop {{ item }}"
  with_items:
    - rabbitmq
  ignore_errors: true

- name: "ensure old services are uninstalled"
  shell: "/opt/homebrew/bin/brew uninstall {{ item }}"
  with_items:
    - rabbitmq
  ignore_errors: true

- name: "remove vsh related files in '/usr/local/bin/'"
  file:
    path: "/usr/local/bin/{{ item }}"
    state: absent
  with_items:
    - mysql
    - mysql5.7
    - mysql8.0
    - mysql8.4
    - mysqladmin
    - mysqladmin5.7
    - mysqladmin8.0
    - mysqladmin8.4
    - mariadb10.11
    - mariadb10.4
    - mariadb10.6
    - mariadb11.4
    - mariadump10.4
    - mariadump10.6
    - mariadump10.11
    - mariadump11.4
    - mariaadmin10.4
    - mariaadmin10.6
    - mariaadmin10.11
    - mariaadmin11.4
    - valkey8-cli
    - composer
    - composer1
    - default-composer
    - default-mysql
    - default-mysqladmin
    - default-mysqldump
    - mysqldump
    - mysqldump5.7
    - mysqldump8.0
    - mysqldump8.4
  become: true

- name: "remove vsh related files in '{{ current_home }}/'"
  file:
    path: "{{ current_home }}/{{ item }}"
    state: absent
  with_items:
    - .my10.4.cnf
    - .my10.6.cnf
    - .my10.11.cnf
    - .my11.4.cnf
    - .my5.7.cnf
    - .my8.0.cnf
    - .my8.4.cnf
    - .my.cnf
  become: true

- name: "remove files, links directories"
  file:
    path: "{{ item }}"
    state: absent
  with_items:
    - /usr/local/bin/brew_x86

- name: "remove '{{ valet_etc_path }}/services.yml'"
  file:
    path: "{{ valet_etc_path }}/services.yml"
    state: absent
  become: true
