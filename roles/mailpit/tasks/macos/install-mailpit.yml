---

- name: Pull mailpit image
  apple_image:
    name: "{{ current_service.configuration.docker_image }}"
    pull: true
    state: present

- name: provide LaunchAgent service for mailpit container
  ansible.builtin.template:
    src: "LaunchAgent/sh.valet.vsh-mailpit.plist.j2"
    dest: "{{ current_home }}/Library/LaunchAgents/sh.valet.vsh-{{ current_service.service.name }}.plist"
    owner: "{{ current_user }}"
    group: "{{ current_group }}"
    mode: "0644"
  notify: "systemd | vsh-mailpit | restarted"

- name: set 'cert_prefix' variable
  ansible.builtin.set_fact:
    cert_prefix: "mailpit"

- name: "generate ssl-certificate for {{ cert_prefix }}"
  ansible.builtin.include_role:
    name: certificate
    public: true

- name: provide nginx vhost for mailpit
  ansible.builtin.template:
    src: "mailpit.conf.j2"
    dest: "/opt/homebrew/etc/nginx/conf.d/mailpit.conf"
    mode: "0644"
  notify: brew | nginx | restarted

- name: "Flush handlers"
  ansible.builtin.meta: flush_handlers

- name: unset 'cert_prefix' variable
  ansible.builtin.set_fact:
    cert_prefix: "{{ non_existent | default(None) }}"

- name: "Add mailpit to installed services"
  vsh_bundle_state:
    action: "installed"
    canonical_names: "{{ current_service.canonical }}"
