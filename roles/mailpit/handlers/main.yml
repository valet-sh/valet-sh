---

- name: "systemd | vsh-mailpit | stopped"
  ansible.builtin.systemd:
    daemon_reload: true
    name: "{{ mailpit_item.service.name }}"
    state: stopped
    scope: "{{ mailpit_item.service.scope }}"
  loop: "{{ valet_resolved_service.services | selectattr('canonical', 'match', '^mailpit.*') }}"
  loop_control:
    loop_var: mailpit_item
  listen: "systemd | vsh-mailpit | stopped"

- name: "systemd | vsh-mailpit | started"
  ansible.builtin.systemd:
    daemon_reload: true
    name: "{{ mailpit_item.service.name }}"
    state: started
    scope: "{{ mailpit_item.service.scope }}"
  loop: "{{ valet_resolved_service.services | selectattr('canonical', 'match', '^mailpit.*') }}"
  loop_control:
    loop_var: mailpit_item
  listen: "systemd | vsh-mailpit | started"

- name: "systemd | vsh-mailpit | restarted"
  ansible.builtin.systemd:
    daemon_reload: true
    name: "{{ mailpit_item.service.name }}"
    state: restarted
    scope: "{{ mailpit_item.service.scope }}"
  loop: "{{ valet_resolved_service.services | selectattr('canonical', 'match', '^mailpit.*') }}"
  loop_control:
    loop_var: mailpit_item
  listen: "systemd | vsh-mailpit | restarted"

- name: brew | mailpit | stopped
  ansible.builtin.shell: "{{ valet_sh_homebrew_bin }} services stop mailpit"
- name: brew | mailpit | started
  ansible.builtin.shell: "{{ valet_sh_homebrew_bin }} services start mailpit"
- name: brew | mailpit | restart
  ansible.builtin.shell: "{{ valet_sh_homebrew_bin }} services restart mailpit"
