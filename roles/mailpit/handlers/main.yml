---

- name: "systemd | vsh-mailpit | stopped"
  ansible.builtin.systemd:
    daemon_reload: true
    name: "{{ mailpit_item.service.name }}"
    state: stopped
    scope: "{{ mailpit_item.service.scope }}"
  loop: "{{ vsh_resolver.services | selectattr('canonical', 'match', '^mailpit.*') }}"
  loop_control:
    loop_var: mailpit_item
  listen: "systemd | vsh-mailpit | stopped"

- name: "systemd | vsh-mailpit | started"
  ansible.builtin.systemd:
    daemon_reload: true
    name: "{{ mailpit_item.service.name }}"
    state: started
    scope: "{{ mailpit_item.service.scope }}"
  loop: "{{ vsh_resolver.services | selectattr('canonical', 'match', '^mailpit.*') }}"
  loop_control:
    loop_var: mailpit_item
  listen: "systemd | vsh-mailpit | started"

- name: "systemd | vsh-mailpit | restarted"
  ansible.builtin.systemd:
    daemon_reload: true
    name: "{{ mailpit_item.service.name }}"
    state: restarted
    scope: "{{ mailpit_item.service.scope }}"
  loop: "{{ vsh_resolver.services | selectattr('canonical', 'match', '^mailpit.*') }}"
  loop_control:
    loop_var: mailpit_item
  listen: "systemd | vsh-mailpit | restarted"

- name: "LaunchAgent | vsh-mailpit | daemon-reload"
  vsh_launchagent:
    label: "sh.valet.{{ mailpit_item.service.name }}"
    daemon_reload: true
  loop: "{{ vsh_resolver.services | selectattr('canonical', 'match', '^mailpit.*') }}"
  loop_control:
    loop_var: mailpit_item
  listen: "LaunchAgent | vsh-mailpit | daemon-reload"

- name: "LaunchAgent | vsh-mailpit | started"
  vsh_launchagent:
    label: "sh.valet.{{ mailpit_item.service.name }}"
    state: started
  loop: "{{ vsh_resolver.services | selectattr('canonical', 'match', '^mailpit.*') }}"
  loop_control:
    loop_var: mailpit_item
  listen: "LaunchAgent | vsh-mailpit | started"

- name: "LaunchAgent | vsh-mailpit | stopped"
  vsh_launchagent:
    label: "sh.valet.{{ mailpit_item.service.name }}"
    state: stopped
  loop: "{{ vsh_resolver.services | selectattr('canonical', 'match', '^mailpit.*') }}"
  loop_control:
    loop_var: mailpit_item
  listen: "LaunchAgent | vsh-mailpit | stopped"

- name: "LaunchAgent | vsh-mailpit | restarted"
  vsh_launchagent:
    label: "sh.valet.{{ mailpit_item.service.name }}"
    state: restarted
  loop: "{{ vsh_resolver.services | selectattr('canonical', 'match', '^mailpit.*') }}"
  loop_control:
    loop_var: mailpit_item
  listen: "LaunchAgent | vsh-mailpit | restarted"
