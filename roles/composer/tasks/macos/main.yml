---

- name: "ensure '/usr/local/bin/composer1.phar' is absent"
  file:
    path: "/usr/local/bin/composer1.phar"
    state: absent
  become: true

- name: "ensure '/usr/local/bin/default-composer' is absent"
  file:
    path: "/usr/local/bin/default-composer"
    state: absent
  become: true

- name: "ensure composer-2 is installed and lastest version"
  get_url:
    url: https://getcomposer.org/composer-2.phar
    dest: "{{ composer2_phar_bin }}"
    owner: "{{ current_user }}"
    group: "{{ current_group }}"
    mode: "0755"
    force: true
  become: true

- name: "ensure symlink '{{ composer2_bin }}' to '{{ composer2_phar_bin }}' exists"
  file:
    src: "{{ composer2_phar_bin }}"
    dest: "{{ composer2_bin }}"
    state: link
    force: true
  become: true

- name: "ensure symlink '/usr/local/bin/composer' to '{{ composer2_phar_bin }}' exists"
  file:
    src: "{{ composer2_phar_bin }}"
    dest: "/usr/local/bin/composer"
    state: link
    force: true
  become: true
