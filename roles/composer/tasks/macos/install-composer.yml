---

- name: Debug current_service
  ansible.builtin.debug:
    var: current_service

- name: "ensure composer-{{ current_service.version }} is installed"
  ansible.builtin.get_url:
    url: https://getcomposer.org/composer-{{ current_service.version }}.phar
    dest: "{{ current_service.configuration.phar_bin }}"
    owner: "{{ current_user }}"
    group: "{{ current_group }}"
    mode: "0755"
    force: true
  become: true

- name: "create symlink for default composer version"
  ansible.builtin.file:
    src: "{{ current_service.configuration.phar_bin }}"
    dest: "{{ current_service.configuration.bin_path }}"
    owner: "{{ current_user }}"
    group: "{{ current_group }}"
    state: link
    force: true
  become: true

- name: "create symlink for default composer version"
  ansible.builtin.file:
    src: "{{ current_service.configuration.phar_bin }}"
    dest: "/usr/local/bin/composer"
    owner: "{{ current_user }}"
    group: "{{ current_group }}"
    state: link
    force: true
  become: true

- name: "Mark composer{{ current_service.version }} as installed in the bundle file"
  vsh_bundle_state:
    action: "installed"
    name: "composer"
    canonical_names: "{{ current_service.canonical }}"
