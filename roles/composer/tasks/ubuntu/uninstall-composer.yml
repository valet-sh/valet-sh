---

- name: "ensure composer-{{ current_service.version }} is uninstalled"
  ansible.builtin.file:
    path: "{{ current_service.configuration.phar_bin }}"
    state: absent
  become: true

- name: "Remove symlink for default composer version"
  ansible.builtin.file:
    path: "{{ current_service.configuration.bin_path }}"
    state: absent
  become: true

- name: "Remove symlink for default composer version"
  ansible.builtin.file:
    path: "/usr/local/bin/composer"
    state: absent
  become: true

- name: "Remove composer from installed services"
  vsh_bundle_state:
    action: "uninstalled"
    name: "composer1"

- name: "Remove composer from installed services"
  vsh_bundle_state:
    action: "uninstalled"
    name: "composer2"
