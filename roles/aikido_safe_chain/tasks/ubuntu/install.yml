---

- name: "ensure /opt/safe-chain is created"
  ansible.builtin.file:
    path: "/opt/safe-chain"
    owner: "{{ current_user }}"
    group: "{{ current_group }}"
    mode: "0755"
    state: directory
  become: true

- name: ensure that aikido safe-chain is installed
  ansible.builtin.get_url:
    url: "{{ aikdio_safe_chain_download_url }}"
    dest: "/opt/safe-chain/safe-chain"
    owner: "{{ current_user }}"
    group: "{{ current_group }}"
    mode: "0755"
  become: true

- name: "ensure symlink '/usr/local/bin/safe-chain' to '/opt/safe-chain/safe-chain' exists"
  ansible.builtin.file:
    src: "/opt/safe-chain/safe-chain"
    dest: "/usr/local/bin/safe-chain"
    state: link
    force: true
  become: true

- name: "run '/usr/local/bin/safe-chain setup'"
  ansible.builtin.command: "/usr/local/bin/safe-chain setup"

- name: "Mark nginx as installed in the services file"
  vsh_bundle_state:
    action: "installed"
    canonical_names: "aikido_safe_chain"
