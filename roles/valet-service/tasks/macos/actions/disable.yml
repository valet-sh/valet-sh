---

- name: "actions » disable | fail when service defintion is not defined"
  ansible.builtin.fail:
    msg: "service definition is not defined cannot disable service"
  when: service_item.service is not defined

- name: "actions » disable | disable {{ service_item.service.name }} service (running as root) (using homebrew)"
  ansible.builtin.shell: "{{ valet_sh_homebrew_bin_sudo }} services stop {{ service_item.service.name }}"
  failed_when: false
  when: service_item.service.scope == 'system' and service_item.service.provider == 'homebrew'

- name: "actions » disable | disable {{ service_item.service.name }} service (using homewbrew)"
  ansible.builtin.shell: "{{ valet_sh_homebrew_bin }} services stop {{ service_item.service.name }}"
  failed_when: false
  when: service_item.service.scope == 'system' and service_item.service.provider == 'homebrew'

- name: "actions » disable | disable {{ service_item.service.name }} service (using container)"
  apple_container:
    name: "{{ service_item.service.name }}"
    state: stopped
  when: service_item.service.provider == 'container' and service_item.service.scope == 'user'

- name: "actions » disable | remove {{ service_item.service.name }} from container autostart"
  ansible.builtin.lineinfile:
    path: /usr/local/valet-sh/etc/container-autostart
    line: "vsh-{{ service_item.canonical }}"
    state: "absent"
  when: service_item.service.provider == 'container'

- name: "actions » disable | set {{ service_item.canonical }} as disabled using vsh_bundle_state module"
  vsh_bundle_state:
    action: "disabled"
    canonical_names: "{{ service_item.canonical }}"
  register: vsh_bundle_state_result
