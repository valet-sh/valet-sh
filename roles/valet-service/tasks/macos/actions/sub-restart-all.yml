---

- name: "actions » restart | include valet bundle file"
  ansible.builtin.include_vars:
    file: "{{ valet_etc_services_file }}"
    name: valet_restart_all_services

- name: "actions » restart | set all enabled services to restart"
  ansible.builtin.set_fact:
    valet_restart_all_enabled: "{{ valet_restart_all_services.bundles.services.states.keys() | list }}"

- name: "actions » restart | resolve all enabled services to restart"
  vsh_bundle_resolver:
    name: "{{ valet_restart_all_enabled }}"
    current_os: "{{ current_os }}"
  register: vsh_resolver

- name: "actions » restart | restart {{ service_item.service.name }} service (running as root) (using homebrew)"
  ansible.builtin.shell: "{{ valet_sh_homebrew_bin_sudo }} services restart {{ service_item.service.name }}"
  loop: "{{ vsh_resolver.services }}"
  loop_control:
    loop_var: service_item
  when: service_item.service.scope == 'system' and service_item.service.provider == 'homebrew'

- name: "actions » restart | restart {{ service_item.service.name }} service (using homebrew)"
  ansible.builtin.shell: "{{ valet_sh_homebrew_bin }} services restart {{ service_item.service.name }}"
  loop: "{{ vsh_resolver.services }}"
  loop_control:
    loop_var: service_item
  when: service_item.service.scope == 'user' and service_item.service.provider == 'homebrew'

- name: "actions »  restart | restart {{ service_item.service.name }} service (using container)"
  apple_container:
    name: "{{ service_item.service.name }}"
    state: restarted
  loop: "{{ vsh_resolver.services }}"
  loop_control:
    loop_var: service_item
  when:  service_item.service.scope == 'user' and service_item.service.provider == 'container'
