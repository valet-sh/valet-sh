---

- name: "actions » default | check if service specific default tasks are available"
  ansible.builtin.stat:
    path: "{{ role_path }}/tasks/macos/actions/defaults/{{ service_item.family_name | default(service_item.name, true) }}.yml"
  register: service_default_tasks

- name: "actions » default | include service specific default tasks"
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/macos/actions/defaults/{{ service_item.family_name | default(service_item.name, true) }}.yml"
  vars:
    item: "{{ service_item }}"
  when: service_default_tasks.stat.exists

- name: "actions » default | set service as default using vsh_bundle_state module"
  vsh_bundle_state:
    action: "default"
    name: "{{ service_item.family_name | default(service_item.name, true) }}"
    canonical_names: "{{ service_item.canonical }}"
