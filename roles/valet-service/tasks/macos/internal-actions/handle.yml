---
###########################
## start handle service states

- name: "internal-actions » handle | determine which services should have their default enforced"
  vsh_bundle_default_candidates:
    bundle_etc_file: "{{ valet_etc_services_file }}"
  register: vsh_default_candidates

- name: "internal-actions » handle | resolve default candidate services"
  vsh_bundle_resolver:
    name: "{{ vsh_default_candidates.canonical_names }}"
    current_os: "{{ current_os }}"
  register: vsh_default_resolver
  when: vsh_default_candidates.canonical_names | length > 0

- name: "internal-actions » handle | set valet_all_services to resolved default candidates"
  ansible.builtin.set_fact:
    valet_all_services: "{{ (vsh_default_resolver.services | default([])) + (vsh_default_resolver.packages | default([])) }}"

- name: "internal-actions » handle | run default action for resolved default candidates"
  ansible.builtin.include_tasks: "macos/actions/default.yml"
  loop: "{{ valet_all_services }}"
  loop_control:
    loop_var: service_item
  when: valet_all_services | length > 0

## end handle defaults
########################
