---
###########################
## start handle service states

- name: Debug valet_sh_newly_installed_services
  ansible.builtin.debug:
    var: valet_sh_newly_installed_services

# - name: "internal-actions » handle | flush handlers"
#   ansible.builtin.meta: flush_handlers

- name: "internal-actions » handle | set valet_all_services from newly installed services"
  ansible.builtin.set_fact:
    valet_all_services: "{{ valet_sh_newly_installed_services.services | default([]) }}"

- name: "internal-actions » handle | extract canonical names"
  ansible.builtin.set_fact:
    valet_canonical_names: "{{ valet_all_services | map(attribute='canonical') | list }}"

- name: "internal-actions » handle | set services as enabled using vsh_service_state module"
  vsh_service_state:
    action: "set_enabled"
    canonical_names: "{{ valet_canonical_names }}"

- name: "internal-actions » handle | enable resolved services"
  ansible.builtin.systemd:
    name: "{{ service_item.service.name }}"
    state: started
    enabled: true
    scope: "{{ service_item.service.scope }}"
    daemon_reload: true
  loop: "{{ valet_all_services }}"
  loop_control:
    loop_var: service_item
  when: service_item.service.name is defined

## end handle services states
########################

#######################
## start handle defaults

- name: "internal-actions » handle | include valet services file to check existing defaults"
  ansible.builtin.include_vars:
    file: "{{ valet_etc_services_file }}"
    name: valet_sh_services_obj

- name: "internal-actions » handle | set default only for services without existing defaults"
  vsh_service_state:
    action: "set_default"
    service_name: "{{ service_item.service_name }}"
    canonical_names: "{{ service_item.canonical }}"
  loop: "{{ valet_all_services }}"
  loop_control:
    loop_var: service_item
  when:
    - service_item.defaultable | default(false)
    - service_item.service_name not in (valet_sh_services_obj.services.defaults.keys() | default([]))

- name: "internal-actions » handle | run default action for defaultable services"
  ansible.builtin.include_tasks: "ubuntu/actions/default.yml"
  vars:
    valet_service_name: "{{ service_item.canonical }}"
  loop: "{{ valet_all_services }}"
  loop_control:
    loop_var: service_item
  when: service_item.defaultable | default(false)

## end handle defaults
########################
