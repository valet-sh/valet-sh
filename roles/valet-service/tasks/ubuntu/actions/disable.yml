---

- name: "actions » disable | fail when no service name was given"
  ansible.builtin.fail:
    msg: "supplied no service names"
  when: (valet_service_names is not defined) or (valet_service_names | length == 0)

- name: "actions » disable | check if service is installed"
  vsh_service_state:
    action: "is_installed"
    canonical_names: "{{ valet_canonical_names }}"
  register: service_installation_check

- name: "actions » disable | fail if service is not installed"
  ansible.builtin.fail:
    msg: "services '{{ service_installation_check.checked_canonical_names | join(', ') }}' are not installed. Please install them first."
  when: not service_installation_check.is_installed

- name: "actions » disable | set services as disabled using vsh_service_state module"
  vsh_service_state:
    action: "set_disabled"
    canonical_names: "{{ valet_canonical_names }}"

- name: "actions » disable | disable resolved services"
  ansible.builtin.systemd:
    name: "{{ service_item.service.name }}"
    state: stopped
    enabled: false
    scope: "{{ service_item.service.scope }}"
    daemon_reload: true
  become: "{{ service_item.service.scope == 'system' }}"
  loop: "{{ valet_all_services }}"
  loop_control:
    loop_var: service_item
