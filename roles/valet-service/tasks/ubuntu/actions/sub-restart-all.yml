---

- name: "Block"
  block:
    - name: "actions » restart | include valet bundle file"
      ansible.builtin.include_vars:
        file: "{{ valet_etc_services_file }}"
        name: valet_restart_all_services

    - name: "actions » restart | set all enabled services to restart"
      ansible.builtin.set_fact:
        valet_restart_all_enabled: "{{ valet_restart_all_services.bundles.services.states.keys() | list }}"

    - name: "actions » restart | resolve all enabled services to restart"
      vsh_bundle_resolver:
        name: "{{ valet_restart_all_enabled }}"
        current_os: "{{ current_os }}"
      register: vsh_resolver

    - name: "actions » restart | restart all resolved services"
      ansible.builtin.systemd:
        name: "{{ service_item.service.name }}"
        state: restarted
        scope: "{{ service_item.service.scope }}"
        daemon_reload: true
      become: "{{ service_item.service.scope == 'system' }}"
      loop: "{{ vsh_resolver.services }}"
      loop_control:
        loop_var: service_item
