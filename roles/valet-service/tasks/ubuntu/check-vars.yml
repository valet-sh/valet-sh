---
- name: "check-vars | fail when no action was defined"
  ansible.builtin.fail:
    msg: "no action was defined"
  when: (valet_service_action is not defined) or (valet_service_action | length == 0)

- name: "check-vars | fail when action is not allowed"
  ansible.builtin.fail:
    msg: "action '{{ valet_service_action }}' is not allowed"
  when: valet_service_action not in valet_sh_service_allowed_actions

- name: "check-vars | resolve multiple service names and configurations"
  vsh_service_resolver:
    services: ["{{ item }}"]
    current_os: "{{ current_os }}"
  register: valet_resolved_services
  loop: "{{ valet_service_names }}"
  when:
    - valet_service_names is defined
    - valet_service_names | length > 0

- name: "check-vars | create combined resolved service variable"
  ansible.builtin.set_fact:
    valet_canonical_names: "{{ valet_resolved_services.results | map(attribute='services') | flatten | map(attribute='canonical') | list }}"
    valet_all_services: "{{ valet_resolved_services.results | map(attribute='services') | flatten }}"
  when: valet_resolved_services is defined

- name: "check-vars | fail when no service name was given"
  ansible.builtin.fail:
    msg: "supplied no service names"
  when: (valet_service_action != "list" and ((valet_service_names is not defined) or (valet_service_names | length == 0)))

- name: "check-vars | check if service is installed"
  vsh_service_state:
    action: "is_installed"
    canonical_names: "{{ valet_canonical_names }}"
  register: service_installation_check
  when: valet_service_action != "list" and (valet_service_names is defined and valet_service_names | length > 0)

- name: Debug service installation check
  ansible.builtin.debug:
    var: service_installation_check
  when: valet_service_action != "list" and (valet_service_names is defined and valet_service_names | length > 0)

- name: "check-vars | fail if service is not installed"
  ansible.builtin.fail:
    msg: "Services '{{ valet_canonical_names | join(', ') }}' are not installed. Please install them first."
  when: valet_service_action != "list" and (not service_installation_check.is_installed)
