---

valet_sh_service_internal_action: false
valet_sh_service_allowed_actions_default:
  - disable
  - enable
  - restart
  - start
  - stop
  - default
  - list
valet_sh_service_allowed_actions: "{{ lookup('vars', 'valet_sh_service_allowed_actions' + '_' + current_os, default=valet_sh_service_allowed_actions_default) }}"

valet_sh_service_definitions:
  php:
    display_name: "PHP"
    versions: ["5.6", "7.0", "7.1", "7.2", "7.3", "7.4", "8.0", "8.1", "8.2", "8.3", "8.4"]
    role_name: "php"

  elasticsearch:
    display_name: "Elasticsearch"
    versions: ["1", "2", "5", "6", "7", "8"]
    role_name: "elasticsearch"
    family_name: "search_engine"

  opensearch:
    display_name: "OpenSearch"
    versions: ["1", "2", "3"]
    role_name: "opensearch"
    family_name: "search_engine"

  mysql:
    display_name: "MySQL"
    versions: ["5.7", "8.0", "8.4"]
    role_name: "mysql-community-server"
    family_name: "database"

  mariadb:
    display_name: "MariaDB"
    versions: ["10.4", "10.6", "10.11", "11.4"]
    role_name: "mariadb-server"
    family_name: "database"

  nginx:
    display_name: "Nginx"
    role_name: "nginx"

  redis:
    display_name: "Redis"
    versions: ["6", "7"]
    role_name: "redis"
    family_name: "cache"

  valkey:
    display_name: "Valkey"
    versions: ["8"]
    role_name: "valkey"
    family_name: "cache"

  rabbitmq:
    display_name: "RabbitMQ"
    versions: ["3.12"]
    role_name: "rabbitmq"

  dnsmasq:
    display_name: "Dnsmasq"
    role_name: "dnsmasq"
    enable_allowed: false

  mailpit:
    display_name: "Mailpit"
    versions: ["latest"]
    role_name: "mailpit"
