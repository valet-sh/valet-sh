---

service:
  name:
    ubuntu: "vsh-mariadb1011"
    mac: "vsh-mariadb1011"
  scope:
    ubuntu: "user"
    mac: "user"
  provider:
    ubuntu: "systemd"
    mac: "container"

configuration:
  docker_image: "docker.io/library/mariadb:10.11"
  limits:
    memory: "4g"
    cpus: "2"
  ports:
    tcp: 3324
  base_path: "/usr/local/valet-sh/packages/mariadb1011"
  default_root_password: "root"
  default_user: "mysql"
  default_group: "mysql"
