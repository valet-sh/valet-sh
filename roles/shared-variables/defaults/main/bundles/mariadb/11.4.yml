---

service:
  name:
    ubuntu: "vsh-mariadb114"
    mac: "vsh-mariadb114"
  scope:
    ubuntu: "user"
    mac: "user"
  provider:
    ubuntu: "systemd"
    mac: "container"

configuration:
  docker_image: "docker.io/library/mariadb:11.4"
  limits:
    memory: "4g"
    cpus: "2"
  ports:
    tcp: 3329
  base_path: "/usr/local/valet-sh/packages/mariadb114"
  default_root_password: "root"
  default_user: "mysql"
  default_group: "mysql"
