---

service:
  name:
    ubuntu: "php7.1-fpm"
    mac: "vsh-php71"
  scope:
    ubuntu: "system"
    mac: "user"
  provider:
    ubuntu: "systemd"
    mac: "homebrew"

configuration:
  package_names:
    ubuntu: ["php7.1-fpm", "php7.1-cli"]
    mac: ["php7.1-fpm", "php7.1-cli"]
  config_paths:
    ubuntu: ["/etc/php/7.1"]
  settings:
    ubuntu:
      cli: |
        date.timezone = Europe/Berlin
        error_log = /tmp/php_errors.log
        sendmail_path = podman exec -i vsh-mailpit sendmail -t -S localhost:1025
        memory_limit = 8192M
        error_reporting = E_ALL
      fpm: |
        date.timezone = Europe/Berlin
        max_execution_time = 900
        error_log = /tmp/php_errors.log
        memory_limit = 512M
        upload_max_filesize = 128M
        post_max_size = 128M
        max_input_vars = 10000
        sendmail_path = podman exec -i vsh-mailpit sendmail -t -S localhost:1025
        error_reporting = E_ALL
      modules:
        - "xmlrpc"
        - "xml"
        - "readline"
        - "opcache"
        - "mysql"
        - "json"
        - "intl"
        - "gd"
        - "fpm"
        - "curl"
        - "cli"
        - "soap"
        - "mbstring"
        - "zip"
        - "bcmath"
        - "ldap"
        - "sqlite3"
    mac:
      global: |
        date.timezone=Europe/Berlin
        max_execution_time=900
        error_log=/tmp/php_errors.log
        memory_limit=8192M
        upload_max_filesize=128M
        post_max_size=128M
        max_input_vars=10000
        sys_temp_dir=/private/var/tmp

        session.auto_start = off
        session.gc_probability = 0
        suhosin.session.cryptua = off

        ; Disable garbage collector
        zend.enable_gc = off

        sendmail_path = container exec -i vsh-mailpit sendmail -t -S localhost:1025

        [opcache]
        opcache.enable = 1
        opcache.enable_cli = 1
        opcache.memory_consumption = 2048
        opcache.interned_strings_buffer = 20
        ;opcache.file_cache= 0
        opcache.max_accelerated_files = 80000
        opcache.max_wasted_percentage = 5
        opcache.use_cwd = 1
        opcache.validate_timestamps = 1
        opcache.revalidate_freq = 0
        opcache.file_update_protection = 2
        opcache.revalidate_path = 0
        opcache.save_comments = 1
        opcache.load_comments = 1
        opcache.fast_shutdown = 1
        opcache.enable_file_override = 0
        opcache.optimization_level = 0xffffffff
        opcache.inherited_hack = 1
        opcache.blacklist_filename = ""
        opcache.max_file_size = 0
        opcache.consistency_checks = 0
        opcache.force_restart_timeout = 180
        opcache.error_log = ""
        opcache.log_verbosity_level = 1
        opcache.preferred_memory_model = ""
        opcache.protect_memory = 0
        apc.cache_by_default = false
