---

service:
  name:
    ubuntu: "vsh-mysql80"
    mac: "vsh-mysql80"
  scope:
    ubuntu: "user"
    mac: "user"
  provider:
    ubuntu: "systemd"
    mac: "container"

configuration:
  docker_image: "docker.io/library/mysql:8.0"
  limits:
    memory: "4g"
    cpus: "2"
  ports:
    tcp: 3308
  base_path: "/usr/local/valet-sh/packages/mysql80"
  default_root_password: "root"
  default_user: "mysql"
  default_group: "mysql"
