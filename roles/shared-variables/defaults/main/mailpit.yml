---

mailpit_release_url_default: "https://github.com/axllent/mailpit/releases/download/v1.27.9/mailpit-linux-amd64.tar.gz"
mailpit_release_url_mac_amd64: "https://github.com/axllent/mailpit/releases/download/v1.27.9/mailpit-darwin-amd64.tar.gz"
mailpit_release_url_mac_arm64: "https://github.com/axllent/mailpit/releases/download/v1.27.9/mailpit-darwin-arm64.tar.gz"

mailpit_release_url: "{{ lookup('vars', 'mailpit_release_url'+'_'+current_os + '_' + current_arch, default=mailpit_release_url_default) }}"

mailpit_bin_target_default: "{{ mailpit_dist_dir }}/mailpit"
mailpit_bin_target: "{{ lookup('vars', 'mailpit_bin_target'+'_'+current_os, default=mailpit_bin_target_default) }}"


mailpit_base_dir: "{{ valet_packages_path }}/mailpit"
mailpit_dist_dir: "{{ mailpit_base_dir }}/dist"