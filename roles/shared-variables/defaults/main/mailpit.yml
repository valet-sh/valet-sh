---

mailpit_arch_map:
  x86_64: "amd64"
  aarch64: "arm64"
  armv7l: "arm"

mailpit_download_url: "https://github.com/axllent/mailpit/releases/latest/download/mailpit-linux-{{ mailpit_arch_map[ansible_facts['architecture']] | default('amd64') }}.tar.gz"

mailpit_bin_path: "/usr/local/bin/mailpit"
mailpit_sendmail_path: "/usr/sbin/sendmail"
