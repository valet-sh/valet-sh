---

service:
  name:
    ubuntu: "vsh-opensearch1"
    mac: "vsh-opensearch1"
  scope:
    ubuntu: "user"
    mac: "user"

configuration:
  docker_image: "docker.io/opensearch:1.3.1"
  ports:
    http: 9221
    transport: 9321
  base_path: "/usr/local/valet-sh/packages/opensearch1"
  plugins:
    default_plugins: ["analysis-phonetic", "analysis-icu"]
    install_command: "/usr/share/opensearch/bin/opensearch-plugin install {{ name }}"
