---

service:
  name:
    ubuntu: "vsh-opensearch3"
    mac: "vsh-opensearch3"
  scope:
    ubuntu: "user"
    mac: "user"

configuration:
  docker_image: "docker.io/opensearchproject/opensearch:3.2.0"
  ports:
    http: 9223
    transport: 9323
  base_path: "/usr/local/valet-sh/packages/opensearch3"
  plugins:
    default_plugins: ["analysis-phonetic", "analysis-icu"]
    install_command: "/usr/share/opensearch/bin/opensearch-plugin install {{ name }}"
