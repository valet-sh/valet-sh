---

- name: "ensue dnsmasq is stopped"
  ansible.builtin.shell: "{{ valet_sh_homebrew_bin }} services stop dnsmasq"

- name: "remove dnsmasq domain resolver configuration"
  ansible.builtin.file:
    path: "/etc/resolver/{{ dnsmasq_domain }}"
    state: absent
  become: true

- name: "remove dnsmasq development domain configuration"
  ansible.builtin.file:
    path: "{{ valet_sh_homebrew_prefix }}/etc/dnsmasq.d/development-domain.conf"
    state: absent
  become: true

- name: "remove dnsmasq port configuration"
  ansible.builtin.lineinfile:
    path: "{{ valet_sh_homebrew_prefix }}/etc/dnsmasq.conf"
    line: "port=5354"
    state: absent
  become: true

- name: "remove dnsmasq interfaces configuration"
  ansible.builtin.lineinfile:
    path: "{{ valet_sh_homebrew_prefix }}/etc/dnsmasq.conf"
    regexp: "^interface="
    state: absent
  become: true

- name: "remove dnsmasq bind-interfaces configuration"
  ansible.builtin.lineinfile:
    path: "{{ valet_sh_homebrew_prefix }}/etc/dnsmasq.conf"
    line: "bind-interfaces"
    state: absent
  become: true

- name: "uninstall dnsmasq"
  homebrew:
    name: dnsmasq
    state: absent

- name: "Remove dnsmasq from installed services"
  vsh_bundle_state:
    action: "uninstalled"
    canonical_names: "dnsmasq"
