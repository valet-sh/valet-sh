---

- name: set current mysql base path
  set_fact:
    current_mysql_base_path: "{{ mysql_community_server.base_path }}80"
    current_mysql_version_key: "80"
    current_mysql_key: "mysql80"

- name: set curent dist path
  set_fact:
    current_mysql_etc_path: "{{ current_mysql_base_path }}/etc"
    current_mysql_etc_conf_path: "{{ current_mysql_base_path }}/etc/conf.d"

- name: "create basic directories"
  file:
    path: "{{ current_mysql_base_directory }}"
    owner: "{{ current_user }}"
    group: "{{ current_group }}"
    mode: '0755'
    state: directory
  become: true
  with_items:
    - "{{ current_mysql_base_path }}"
    - "{{ current_mysql_etc_path }}"
    - "{{ current_mysql_etc_conf_path }}"
  loop_control:
    loop_var: current_mysql_base_directory


- name: "Pull {{ current_mysql_key }} image"
  containers.podman.podman_image:
    name: "{{ mysql_community_server_80.image }}"
    pull: true
    state: present

- name: "provide .my.cnf configuration file"
  template:
    src: "{{ current_mysql_key }}/.my.cnf.j2"
    dest: "{{ current_home }}/.my8.0.cnf"
    mode: '0644'

- name: "provide my.cnf configuration file"
  template:
    src: "{{ current_mysql_key }}/my.cnf.j2"
    dest: "{{ current_mysql_etc_path }}/my.cnf"
    mode: '0644'
  notify: "systemd | {{ current_mysql_key }} | restarted"

- name: "provide mysqld.cnf configuration file"
  template:
    src: "{{ current_mysql_key }}/mysqld.cnf.j2"
    dest: "{{ current_mysql_etc_conf_path }}/mysqld.cnf"
    owner: "{{ current_user }}"
    group: "{{ current_group }}"
    mode: '0644'
  notify: "systemd | {{ current_mysql_key }} | restarted"

- name: "ensure user systemd directory exists"
  file:
    path: "{{ current_home }}/.config/systemd/user"
    state: directory
    mode: '0755'

- name: "provide {{ current_mysql_key }} systemd unit file"
  template:
    src: "systemd/{{ current_mysql_key }}.service.j2"
    dest: "{{ current_home }}/.config/systemd/user/{{ current_mysql_key }}.service"
    owner: "{{ current_user }}"
    group: "{{ current_group }}"
    mode: '0644'
  notify: "systemd | {{ current_mysql_key }} | restarted"

- name: "provide {{ current_mysql_key }} mysql client"
  template:
    src: "wrapper/mysql.j2"
    dest: "/usr/local/bin/mysql{{ current_mysql_version_key }}"
    owner: root
    group: root
    mode: '0755'
  become: true

- name: "provide mysqldump{{ current_mysql_version_key }} client"
  template:
    src: "wrapper/mysqldump.j2"
    dest: "/usr/local/bin/mysqldump{{ current_mysql_version_key }}"
    owner: root
    group: root
    mode: '0755'
  become: true

- name: "provide mysqladmin{{ current_mysql_version_key }} client"
  template:
    src: "wrapper/mysqladmin.j2"
    dest: "/usr/local/bin/mysqladmin{{ current_mysql_version_key }}"
    owner: root
    group: root
    mode: '0755'
  become: true

- name: "Ensure {{ current_mysql_key }} is started"
  systemd:
    name: "{{ current_mysql_key }}"
    state: started
    daemon_reload: true
    scope: user

- name: Test MySQL connection and get info
  mysql_info:
    login_host: "127.0.0.1"
    login_port: "{{ mysql_community_server_80.port }}"
    login_user: root
    login_password: "{{ mysql_community_server.default_root_password }}"
  register: mysql_status
  until: mysql_status is succeeded
  retries: 30
  delay: 3

- name: Stop {{ current_mysql_key }} service after installation
  when: mysql_status is succeeded
  systemd:
    name: "{{ current_mysql_key }}"
    state: stopped
    scope: user
