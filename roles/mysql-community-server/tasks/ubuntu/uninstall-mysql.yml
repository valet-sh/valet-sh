---

- name: "Ensure that {{ current_service.service.name }} container is stopped"
  ansible.builtin.systemd:
    name: "{{ current_service.service.name }}"
    state: stopped
    daemon_reload: true
    scope: "{{ current_service.service.scope }}"
  ignore_errors: true

- name: "Remove {{ current_service.service.name }} container"
  containers.podman.podman_container:
    name: "vsh-{{ current_service.canonical }}"
    state: absent

- name: "Remove {{ current_service.service.name }} volume"
  containers.podman.podman_volume:
    name: "vsh-{{ current_service.canonical }}-data"
    state: absent
  when: "'--purge' in valet_cli_opts"

- name: "Remove {{ current_service.service.name }} systemd service"
  ansible.builtin.file:
    path: "{{ current_home }}/.config/systemd/user/{{ current_service.service.name }}.service"
    state: absent

- name: "Remove {{ current_service.service.name }} default.target.wants symlink"
  ansible.builtin.file:
    path: "{{ current_home }}/.config/systemd/user/default.target.wants/{{ current_service.service.name }}.service"
    state: absent

- name: "Remove {{ current_service.service.name }} configurations"
  ansible.builtin.file:
    path: "{{ current_service.configuration.base_path }}"
    state: absent

- name: "Remove mysql{{ current_service.version }} wrapper scripts"
  ansible.builtin.file:
    path: "{{ current_wrapper_script }}"
    state: absent
  become: true
  loop:
    - "/usr/local/bin/mysql{{ current_service.version }}"
    - "/usr/local/bin/mysqldump{{ current_service.version }}"
    - "/usr/local/bin/mysqladmin{{ current_service.version }}"
  loop_control:
    loop_var: current_wrapper_script

- name: "Remove {{ current_service.service.name }} image"
  containers.podman.podman_image:
    name: "{{ current_service.configuration.docker_image }}"
    state: absent
    force: true
  when: "'--purge' in valet_cli_opts"

- name: "Remove {{ current_service.service.name }} from installed services"
  vsh_bundle_state:
    action: "uninstalled"
    canonical_names: "{{ current_service.canonical }}"
