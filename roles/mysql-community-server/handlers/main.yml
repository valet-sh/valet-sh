---
- name: systemd | daemon-reload
  ansible.builtin.systemd:
    daemon_reload: true
    scope: user

- name: systemd | vsh-mysql57 | started
  ansible.builtin.systemd:
    name: "{{ current_mysql_systemd_name }}"
    daemon_reload: true
    state: started
    scope: "{{ current_mysql_systemd_scope }}"

- name: systemd | vsh-mysql57 | stopped
  ansible.builtin.systemd:
    name: "{{ current_mysql_systemd_name }}"
    daemon_reload: true
    state: stopped
    scope: "{{ current_mysql_systemd_scope }}"

- name: systemd | vsh-mysql57 | restarted
  ansible.builtin.systemd:
    name: "{{ current_mysql_systemd_name }}"
    daemon_reload: true
    state: restarted
    scope: "{{ current_mysql_systemd_scope }}"

