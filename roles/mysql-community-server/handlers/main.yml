---
- name: systemd | daemon-reload
  ansible.builtin.systemd:
    daemon_reload: true
    scope: user

- name: "systemd | vsh-mysql | started"
  ansible.builtin.systemd:
    daemon_reload: true
    name: "{{ mysql_item.service.name }}"
    state: started
    scope: "{{ mysql_item.service.scope }}"
  loop: "{{ valet_resolved_service.services | selectattr('canonical', 'match', '^mysql.*') }}"
  loop_control:
    loop_var: mysql_item
  listen: "systemd | vsh-mysql | started"

- name: "systemd | vsh-mysql | stopped"
  ansible.builtin.systemd:
    daemon_reload: true
    name: "{{ mysql_item.service.name }}"
    state: stopped
    scope: "{{ mysql_item.service.scope }}"
  loop: "{{ valet_resolved_service.services | selectattr('canonical', 'match', '^mysql.*') }}"
  loop_control:
    loop_var: mysql_item
  listen: "systemd | vsh-mysql | stopped"

- name: "systemd | vsh-mysql | restarted"
  ansible.builtin.systemd:
    daemon_reload: true
    name: "{{ mysql_item.service.name }}"
    state: restarted
    scope: "{{ mysql_item.service.scope }}"
  loop: "{{ valet_resolved_service.services | selectattr('canonical', 'match', '^mysql.*') }}"
  loop_control:
    loop_var: mysql_item
  listen: "systemd | vsh-mysql | restarted"

- name: "systemd | vsh-mysql | reloaded"
  ansible.builtin.systemd:
    daemon_reload: true
    name: "{{ mysql_item.service.name }}"
    state: restarted
    scope: "{{ mysql_item.service.scope }}"
  loop: "{{ valet_resolved_service.services | selectattr('canonical', 'match', '^mysql.*') }}"
  loop_control:
    loop_var: mysql_item
  listen: "systemd | vsh-mysql | reloaded"

- name: brew | vsh-mysql57 | started
  ansible.builtin.shell: "{{ valet_sh_homebrew_bin }} services start vsh-mysql57"
- name: brew | vsh-mysql57 | stopped
  ansible.builtin.shell: "{{ valet_sh_homebrew_bin }} services stop vsh-mysql57"
- name: brew | vsh-mysql57 | restarted
  ansible.builtin.shell: "{{ valet_sh_homebrew_bin }} services restart vsh-mysql57"
- name: brew | vsh-mysql80 | started
