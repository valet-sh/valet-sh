##
---

- name: "partials » check-hub | check if a hub is configured in '{{ valet_sh_filename }}'"
  ansible.builtin.set_fact:
    valet_sh_hub_configured: "{{ (valet_sh_project_vars.hub.host | default('') | string | trim | length) > 0 }}"

- name: "partials » check-hub | set skipped-without-hub state"
  ansible.builtin.set_fact:
    valet_restore_skipped_no_hub: "{{ not valet_sh_hub_configured | bool and valet_restore_skip_without_hub | default(false) | bool }}"

- name: "block"
  when: valet_restore_skipped_no_hub | bool
  block:
    - name: "partials » check-hub | no hub configured in '{{ valet_sh_filename }}', skipping restore"
      ansible.builtin.debug:
        msg: "no hub configured in '{{ valet_sh_filename }}' - skipping restore"

    - name: "partials » check-hub | set skip flags"
      ansible.builtin.set_fact:
        valet_opt_flag_skip_restore: true
        valet_opt_flag_skip_db: true
        valet_opt_flag_skip_fs: true
