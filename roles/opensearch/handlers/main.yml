---
- name: "systemd | vsh-opensearch | started"
  ansible.builtin.systemd:
    daemon_reload: true
    name: "{{ opensearch_item.service.name }}"
    state: started
    scope: "{{ opensearch_item.service.scope }}"
  loop: "{{ valet_resolved_service.services | selectattr('canonical', 'match', '^opensearch.*') }}"
  loop_control:
    loop_var: opensearch_item
  listen: "systemd | vsh-opensearch | started"

- name: "systemd | vsh-opensearch | stopped"
  ansible.builtin.systemd:
    daemon_reload: true
    name: "{{ opensearch_item.service.name }}"
    state: stopped
    scope: "{{ opensearch_item.service.scope }}"
  loop: "{{ valet_resolved_service.services | selectattr('canonical', 'match', '^opensearch.*') }}"
  loop_control:
    loop_var: opensearch_item
  listen: "systemd | vsh-opensearch | stopped"

- name: "systemd | vsh-opensearch | restarted"
  ansible.builtin.systemd:
    daemon_reload: true
    name: "{{ opensearch_item.service.name }}"
    state: restarted
    scope: "{{ opensearch_item.service.scope }}"
  loop: "{{ valet_resolved_service.services | selectattr('canonical', 'match', '^opensearch.*') }}"
  loop_control:
    loop_var: opensearch_item
  listen: "systemd | vsh-opensearch | restarted"

- name: "systemd | vsh-opensearch | reloaded"
  ansible.builtin.systemd:
    daemon_reload: true
    name: "{{ opensearch_item.service.name }}"
    state: restarted
    scope: "{{ opensearch_item.service.scope }}"
  loop: "{{ valet_resolved_service.services | selectattr('canonical', 'match', '^opensearch.*') }}"
  loop_control:
    loop_var: opensearch_item
  listen: "systemd | vsh-opensearch | reloaded"

- name: brew | vsh-opensearch2 | restarted
  ansible.builtin.shell: "{{ valet_sh_homebrew_bin }} services restart vsh-opensearch2"
