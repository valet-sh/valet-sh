---

- name: "workflows » aem » partials » start | evaluate startup params"
  ansible.builtin.set_fact:
    aem_cq_jvm_opts: "-XX:MaxPermSize=256M"
    aem_cq_jvm_author_xmx: 1024m
    aem_cq_jvm_publish_xmx: 1024m
    aem_cq_jvm_author_max_metaspace_size: 256M
    aem_cq_jvm_publish_max_metaspace_size: 256M
    aem_cq_jvm_author_metaspace_opt: ""
    aem_cq_jvm_publish_metaspace_opt: ""

- name: "workflows » aem » partials » start | override author xmx settings"
  ansible.builtin.set_fact:
    aem_cq_jvm_author_xmx: "{{ valet_sh_project_vars.instance.author_xmx }}"
  when:
    - valet_sh_project_vars.instance is defined
    - valet_sh_project_vars.instance.author_xmx is defined
    - valet_sh_project_vars.instance.author_xmx | length > 0

- name: "workflows » aem » partials » start | override publish xmx settings"
  ansible.builtin.set_fact:
    aem_cq_jvm_publish_xmx: "{{ valet_sh_project_vars.instance.publish_xmx }}"
  when:
    - valet_sh_project_vars.instance is defined
    - valet_sh_project_vars.instance.publish_xmx is defined
    - valet_sh_project_vars.instance.publish_xmx | length > 0

- name: "workflows » aem » partials » start | override author max metaspace size settings"
  ansible.builtin.set_fact:
    aem_cq_jvm_author_max_metaspace_size: "{{ valet_sh_project_vars.instance.author_max_metaspace_size }}"
  when:
    - valet_sh_project_vars.instance is defined
    - valet_sh_project_vars.instance.author_max_metaspace_size is defined
    - valet_sh_project_vars.instance.author_max_metaspace_size | length > 0

- name: "workflows » aem » partials » start | override publish max metaspace size settings"
  ansible.builtin.set_fact:
    aem_cq_jvm_publish_max_metaspace_size: "{{ valet_sh_project_vars.instance.publish_max_metaspace_size }}"
  when:
    - valet_sh_project_vars.instance is defined
    - valet_sh_project_vars.instance.publish_max_metaspace_size is defined
    - valet_sh_project_vars.instance.publish_max_metaspace_size | length > 0

- name: "workflows » aem » partials » start | override startup params when java version is > 11"
  ansible.builtin.set_fact:
    aem_cq_jvm_opts: ""
    aem_cq_jvm_author_metaspace_opt: "-XX:MaxMetaspaceSize={{ aem_cq_jvm_author_max_metaspace_size }}"
    aem_cq_jvm_publish_metaspace_opt: "-XX:MaxMetaspaceSize={{ aem_cq_jvm_publish_max_metaspace_size }}"
  when:
    - valet_sh_project_vars.services is defined
    - valet_sh_project_vars.services.java is defined
    - valet_sh_project_vars.services.java.version is defined
    - valet_sh_project_vars.services.java.version | int > 11

- block:
    - name: "workflows » aem » partials » start | check if .env.publish exists"
      ansible.builtin.stat:
        path: "{{ valet_sh_project_src_path }}/.env.publish"
      register: publish_env_file
    - name: "workflows » aem » partials » start | start publish instance"
      ansible.builtin.shell: |
        {% if publish_env_file.stat.exists %}
        source {{ valet_sh_project_src_path }}/.env.publish && export $(grep -v '^#' {{ valet_sh_project_src_path }}/.env.publish | cut -d= -f1 | xargs)
        {% endif %}
        {{ valet_sh_aem_publish_dir }}/crx-quickstart/bin/start
      args:
        chdir: "{{ valet_sh_aem_publish_dir }}"
      environment:
        CQ_RUNMODE: "publish"
        CQ_PORT: "{{ valet_sh_project_vars.instance.publish_port }}"
        CQ_JVM_OPTS: "-server -Xmx{{ aem_cq_jvm_publish_xmx }} {{ aem_cq_jvm_opts }} {{ aem_cq_jvm_publish_metaspace_opt }} -Djava.awt.headless=true -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address={{
          valet_sh_project_vars.instance.publish_debug_port }}"
  when: valet_action_target == "publish" or valet_action_target == "all"

- block:
    - name: "workflows » aem » partials » start | check if .env.author exists"
      ansible.builtin.stat:
        path: "{{ valet_sh_project_src_path }}/.env.author"
      register: author_env_file
    - name: "workflows » aem » partials » start | start author instance"
      ansible.builtin.shell: |
        {% if author_env_file.stat.exists %}
        source {{ valet_sh_project_src_path }}/.env.author && export $(grep -v '^#' {{ valet_sh_project_src_path }}/.env.author | cut -d= -f1 | xargs)
        {% endif %}
        {{ valet_sh_aem_author_dir }}/crx-quickstart/bin/start
      args:
        chdir: "{{ valet_sh_aem_author_dir }}"
      environment:
        CQ_RUNMODE: "author"
        CQ_PORT: "{{ valet_sh_project_vars.instance.author_port }}"
        CQ_JVM_OPTS: "-server -Xmx{{ aem_cq_jvm_author_xmx }} {{ aem_cq_jvm_opts }} {{ aem_cq_jvm_author_metaspace_opt }} -Djava.awt.headless=true -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address={{
          valet_sh_project_vars.instance.author_debug_port }}"
  when: valet_action_target == "author" or valet_action_target == "all"

- block:
    - name: "workflows » aem » partials » start | check if .env.dispatcher exists"
      ansible.builtin.stat:
        path: "{{ valet_sh_project_src_path }}/.env.dispatcher"
      register: dispatcher_env_file

    - name: "workflows » aem » partials » start | check if docker is available"
      ansible.builtin.shell: "docker info"
      register: dispatcher_docker_info_obj
      changed_when: false
      failed_when: false

    - name: "workflows » aem » partials » start | fail when docker is not available"
      ansible.builtin.fail:
        msg: "docker not available\n{{ dispatcher_docker_info_obj.stderr | default('') }}"
      when: dispatcher_docker_info_obj.rc != 0

    - name: "workflows » aem » partials » start | check if dispatcher container is already running"
      ansible.builtin.shell: "docker container ls --format '{% raw %}{{.Ports}}{% endraw %}' | grep ':{{ valet_sh_project_vars.instance.dispatcher_port }}->'"
      register: dispatcher_running_container_obj
      changed_when: false
      failed_when: dispatcher_running_container_obj.rc not in [ 0, 1 ]

    - block:
        # start docker_run.sh in background, log to output.log, print pid
        - name: "workflows » aem » partials » start | start dispatcher tools"
          ansible.builtin.shell: "HOT_RELOAD=true ALLOW_CACHE_INVALIDATION_GLOBALLY=true {{ dispatcher_env_var }} {{ valet_sh_aem_dispatcher_dir }}/bin/docker_run.sh
            {{ valet_sh_project_src_path }}/dispatcher/src host.docker.internal:{{ valet_sh_project_vars.instance.publish_port }} {{ valet_sh_project_vars.instance.dispatcher_port
            }} > {{ valet_sh_aem_dispatcher_dir }}/output.log 2>&1 & echo $!"
          args:
            chdir: "{{ valet_sh_aem_dispatcher_dir }}"
          vars:
            dispatcher_env_var: "{{ 'ENV_FILE=' + valet_sh_project_src_path + '/.env.dispatcher' if dispatcher_env_file.stat.exists else '' }}"
          register: dispatcher_start_obj

        - name: "workflows » aem » partials » start | wait for dispatcher container to be started"
          ansible.builtin.shell: |
            if docker container ls --format '{% raw %}{{.Ports}}{% endraw %}' | grep -q ':{{ valet_sh_project_vars.instance.dispatcher_port }}->'; then
              echo "running"
            elif ! kill -0 {{ dispatcher_start_obj.stdout | trim }} 2>/dev/null; then
              echo "exited"
            else
              echo "pending"
            fi
          register: dispatcher_state_obj
          changed_when: false
          retries: 30
          delay: 2
          until: dispatcher_state_obj.stdout != "pending"
          ignore_errors: true

        - name: "workflows » aem » partials » start | read dispatcher output log"
          ansible.builtin.command: "tail -n 20 {{ valet_sh_aem_dispatcher_dir }}/output.log"
          register: dispatcher_output_log_obj
          changed_when: false
          failed_when: false
          when: dispatcher_state_obj.stdout != "running"

        - name: "workflows » aem » partials » start | fail when dispatcher could not be started"
          ansible.builtin.fail:
            msg: "{{ dispatcher_fail_reason }}, log: {{ valet_sh_aem_dispatcher_dir }}/output.log\n{{ dispatcher_output_log_obj.stdout | default('') }}"
          vars:
            dispatcher_fail_reason: "{{ 'dispatcher start timed out after 60s (docker_run.sh pid ' + dispatcher_start_obj.stdout | trim + ')'
              if dispatcher_state_obj.stdout == 'pending' else 'dispatcher start failed' }}"
          when: dispatcher_state_obj.stdout != "running"
      when: dispatcher_running_container_obj.stdout | length == 0
  when: valet_action_target == "dispatcher" or valet_action_target == "all"

- name: "workflows » aem » partials » start | fix folder permissions"
  ansible.builtin.shell: "chown -R {{ current_user }}:{{ current_group }} {{ valet_sh_aem_dispatcher_dir }}/cache"
  args:
    removes: "{{ valet_sh_aem_dispatcher_dir }}/cache"
    chdir: "{{ valet_sh_aem_dispatcher_dir }}"
  become: true
