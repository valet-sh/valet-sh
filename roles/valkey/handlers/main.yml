---

- name: systemd | valkey8-server | started
  systemd:
    name: valkey8-server
    state: started
  become: true

- name: systemd | valkey8-server | stopped
  systemd:
    name: valkey8-server
    state: stopped
  become: true

- name: systemd | valkey8-server | restarted
  systemd:
    name: valkey8-server
    state: restarted
  become: true

- name: brew | valkey8 | started
  shell: "{{ valet_sh_homebrew_bin }} services start vsh-valkey8"

- name: brew | valkey8 | stopped
  shell: "{{ valet_sh_homebrew_bin }} services stop vsh-valkey8"

- name: brew | valkey8 | restarted
  shell: "{{ valet_sh_homebrew_bin }} services restart vsh-valkey8"
