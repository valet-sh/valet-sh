---

- name: "systemd | vsh-valkey | started"
  ansible.builtin.systemd:
    daemon_reload: true
    name: "{{ valkey_item.service.name }}"
    state: started
    scope: "{{ valkey_item.service.scope }}"
  loop: "{{ valet_resolved_service.services | selectattr('canonical', 'match', '^valkey.*') }}"
  loop_control:
    loop_var: valkey_item
  listen: "systemd | vsh-valkey | started"

- name: "systemd | vsh-valkey | stopped"
  ansible.builtin.systemd:
    daemon_reload: true
    name: "{{ valkey_item.service.name }}"
    state: stopped
    scope: "{{ valkey_item.service.scope }}"
  loop: "{{ valet_resolved_service.services | selectattr('canonical', 'match', '^valkey.*') }}"
  loop_control:
    loop_var: valkey_item
  listen: "systemd | vsh-valkey | started"

- name: "systemd | vsh-valkey | restarted"
  ansible.builtin.systemd:
    daemon_reload: true
    name: "{{ valkey_item.service.name }}"
    state: restarted
    scope: "{{ valkey_item.service.scope }}"
  loop: "{{ valet_resolved_service.services | selectattr('canonical', 'match', '^valkey.*') }}"
  loop_control:
    loop_var: valkey_item
  listen: "systemd | vsh-valkey | started"

- name: "systemd | vsh-valkey | reloaded"
  ansible.builtin.systemd:
    daemon_reload: true
    name: "{{ valkey_item.service.name }}"
    state: restarted
    scope: "{{ valkey_item.service.scope }}"
  loop: "{{ valet_resolved_service.services | selectattr('canonical', 'match', '^valkey.*') }}"
  loop_control:
    loop_var: valkey_item
  listen: "systemd | vsh-valkey | restarted"


- name: brew | valkey | started
  ansible.builtin.shell: "{{ valet_sh_homebrew_bin }} services start valkey"
- name: brew | valkey | stopped
  ansible.builtin.shell: "{{ valet_sh_homebrew_bin }} services stop valkey"
- name: brew | valkey | restarted
  ansible.builtin.shell: "{{ valet_sh_homebrew_bin }} services restart valkey"
