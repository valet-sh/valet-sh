---

# @TODO: required valkey-tools on mac?!

- name: "Pull valkey-server {{ current_service.service.version }} image"
  apple_image:
    name: "{{ current_service.configuration.docker_image }}"
    pull: true
    state: present

- name: provide LaunchAgent service for valkey container
  ansible.builtin.template:
    src: "LaunchAgent/sh.valet.vsh-rabbitmq.plist.j2"
    dest: "{{ current_home }}/Library/LaunchAgents/sh.valet.vsh-{{ current_service.service.name }}.plist"
    owner: "{{ current_user }}"
    group: "{{ current_group }}"
    mode: "0644"
  notify: "LaunchAgent | vsh-valkey | daemon-reload"

- name: "Flush handlers"
  ansible.builtin.meta: flush_handlers

- name: "Get desired state of vsh-{{ current_service.canonical }} from services file"
  vsh_bundle_service_state_info:
    name: "{{ current_service.canonical }}"
  register: current_service_state

- name: "If desired state is unknown, set it to enabled"
  vsh_bundle_state:
    action: "initialize_empty"
    canonical_names: "{{ current_service.canonical }}"
  when: current_service_state.state == "unknown"

- name: "Update current_service_state after initialization"
  ansible.builtin.set_fact:
    current_service_state: "{{ current_service_state | combine({'state': 'enabled'}) }}"
  when: current_service_state.state == "unknown"

- name: "Ensure target state of vsh-{{ current_service.canonical }} is set"
  vsh_launchagent:
    label: "sh.valet.{{ current_service.service.name }}"
    state: "{{ 'started' if current_service_state.state == 'enabled' else 'stopped' }}"

- name: "Mark vsh-{{ current_service.canonical }} as installed in the services file"
  vsh_bundle_state:
    action: "installed"
    canonical_names: "{{ current_service.canonical }}"
