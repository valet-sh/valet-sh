---

- name: "set handler_current_service fact"
  ansible.builtin.set_fact:
    handler_current_service: "{{ current_service }}"

- name: "create mariadb base directories"
  ansible.builtin.file:
    path: "{{ current_mariadb_base_directory }}"
    owner: "{{ current_user }}"
    group: "{{ current_group }}"
    mode: "0755"
    state: directory
  with_items:
    - "{{ current_service.configuration.base_path }}"
    - "{{ current_service.configuration.base_path }}/user"
    - "{{ current_service.configuration.base_path }}/etc"
    - "{{ current_service.configuration.base_path }}/etc/mariadb.conf.d"
  loop_control:
    loop_var: current_mariadb_base_directory

- name: "Pull {{ current_service.service.name }} image"
  apple_image:
    name: "{{ current_service.configuration.docker_image }}"
    pull: true
    state: present

- name: "ensure volume '{{ current_service.service.name }}-data' exists"
  apple_volume:
    name: "{{ current_service.service.name }}-data"
    state: present
  register: data_volume_obj

- name: "fix volume permissions for '{{ current_service.service.name }}-data'"
  apple_container:
    name: vsh-volume-fix
    image: alpine
    state: started
    remove: true
    detach: false
    volumes:
      - "{{ current_service.service.name }}-data:/data"
    command:
      - chown
      - -R
      - "1000:"
      - /data
  when: data_volume_obj.changed

- name: "provide .my.cnf configuration file"
  ansible.builtin.template:
    src: "config/.my.cnf.j2"
    dest: "{{ current_service.configuration.base_path }}/user/.my.cnf"
    mode: "0644"

- name: "provide mysqld.cnf configuration file"
  ansible.builtin.template:
    src: "config/mysqld.cnf.j2"
    dest: "{{ current_service.configuration.base_path }}/etc/mariadb.conf.d/valet-sh.cnf"
    owner: "{{ current_user }}"
    group: "{{ current_group }}"
    mode: "0644"
  notify: "container | vsh-mariadb | restarted"

- name: "provide mariadb{{ current_service.version }} mysql client"
  ansible.builtin.template:
    src: "wrapper/mariadb.j2"
    dest: "/usr/local/bin/mariadb{{ current_service.version }}"
    owner: "{{ current_user }}"
    group: "{{ current_group }}"
    mode: "0755"
  become: true

- name: "provide mariadump{{ current_service.version }} client"
  ansible.builtin.template:
    src: "wrapper/mariadump.j2"
    dest: "/usr/local/bin/mariadump{{ current_service.version }}"
    owner: "{{ current_user }}"
    group: "{{ current_group }}"
    mode: "0755"
  become: true

- name: "provide mariaadmin{{ current_service.version }} client"
  ansible.builtin.template:
    src: "wrapper/mariaadmin.j2"
    dest: "/usr/local/bin/mariaadmin{{ current_service.version }}"
    owner: "{{ current_user }}"
    group: "{{ current_group }}"
    mode: "0755"
  become: true

- name: "ensure container 'vsh-{{ current_service.canonical }}' is started"
  apple_container:
    name: "vsh-{{ current_service.canonical }}"
    image: "{{ current_service.configuration.docker_image }}"
    state: started
    cpus: "{{ current_service.configuration.limits.cpus | default(2) }}"
    memory: "{{ current_service.configuration.limits.memory | default('1g') }}"
    user: "1000:1000"
    arch: "{{ current_service.configuration.arch | default(omit) }}"
    volumes:
      - "vsh-{{ current_service.canonical }}-data:/var/lib/mysql"
      - "{{ current_service.configuration.base_path }}/etc/mariadb.conf.d/valet-sh.cnf:/etc/mysql/mariadb.conf.d/valet-sh.cnf:Z"
      - "{{ current_service.configuration.base_path }}/user/.my.cnf:/home/.my.cnf:Z"
    env:
      - "MYSQL_ROOT_PASSWORD={{ current_service.configuration.default_root_password }}"

- name: "Wait for {{ current_service.service.name }} to be ready"
  community.mysql.mysql_info:
    login_host: "vsh-{{ current_service.canonical }}.vsh"
    login_port: "{{ current_service.configuration.ports.tcp }}"
    login_user: root
    login_password: "{{ current_service.configuration.default_root_password }}"
  register: mariadb_status
  until: mariadb_status is succeeded
  retries: 30
  delay: 3

- name: "provide nginx stream configuration"
  template:
    src: "nginx/mariadb.conf.j2"
    dest: "{{ valet_sh_prefix }}/etc/nginx/stream.d/{{ current_service.service.name }}.conf"
    owner: "{{ current_user }}"
    group: "{{ current_group }}"
    mode: "0644"
  notify: brew | nginx | restarted

- name: "Flush handlers"
  ansible.builtin.meta: flush_handlers

- name: "Get desired state of {{ current_service.service.name }} from services file"
  vsh_bundle_service_state_info:
    name: "{{ current_service.canonical }}"
  register: current_service_state

- name: "If desired state is unknown, set it to enabled"
  vsh_bundle_state:
    action: "initialize_empty"
    canonical_names: "{{ current_service.canonical }}"
  when: current_service_state.state == "unknown"

- name: "Update current_service_state after initialization"
  ansible.builtin.set_fact:
    current_service_state: "{{ current_service_state | combine({'state': 'enabled'}) }}"
  when: current_service_state.state == "unknown"

- name: "Set {{ current_service.service.name }} container state"
  apple_container:
    name: "vsh-{{ current_service.canonical }}"
    state: "{{ 'started' if current_service_state.state == 'enabled' else 'stopped' }}"

- name: Set container autostart
  ansible.builtin.lineinfile:
    path: /usr/local/valet-sh/etc/container-autostart
    line: "vsh-{{ current_service.canonical }}"
    state: "{{ 'present' if current_service_state.state == 'enabled' else 'absent' }}"

- name: "Mark {{ current_service.service.name }} as installed in the services file"
  vsh_bundle_state:
    action: "installed"
    canonical_names: "{{ current_service.canonical }}"
