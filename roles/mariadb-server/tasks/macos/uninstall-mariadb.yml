---

- name: "ensure 'vsh-{{ current_service.canonical }}' is absent"
  apple_container:
    name: "vsh-{{ current_service.canonical }}"
    state: absent

- name: "Remove 'vsh-{{ current_service.canonical }}-data' volume"
  apple_volume:
    name: "vsh-{{ current_service.canonical }}-data"
    state: absent
  when: "'--purge' in valet_cli_opts"

- name: "Remove vsh-{{ current_service.canonical }} configurations"
  ansible.builtin.file:
    path: "{{ current_service.configuration.base_path }}"
    state: absent

- name: "Remove mariadb{{ current_service.version }} wrapper scripts"
  ansible.builtin.file:
    path: "{{ current_wrapper_script }}"
    state: absent
  become: true
  loop:
    - "/usr/local/bin/mariadb{{ current_service.version }}"
    - "/usr/local/bin/mariadump{{ current_service.version }}"
    - "/usr/local/bin/mariaadmin{{ current_service.version }}"
  loop_control:
    loop_var: current_wrapper_script

- name: "Remove vsh-{{ current_service.canonical }} image"
  apple_image:
    name: "{{ current_service.configuration.docker_image }}"
    state: absent
  when: "'--purge' in valet_cli_opts"

- name: "Remove {{ current_service.service.name }} from installed services"
  vsh_bundle_state:
    action: "uninstalled"
    canonical_names: "{{ current_service.canonical }}"

- name: "Flush handlers"
  ansible.builtin.meta: flush_handlers
