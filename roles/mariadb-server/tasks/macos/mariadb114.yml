---

- name: "ensure vsh-mariadb114 is installed"
  shell: "{{ valet_sh_homebrew_bin }} install vsh-mariadb114"

- name: "provide .my.cnf configuration file"
  template:
    src: "{{ mariadb114_template_dot_my }}"
    dest: "{{ current_home }}/.my10.6.cnf"
    mode: '0644'
  with_first_found:
    - "macos/mariadb114/.my.cnf.j2"
  loop_control:
    loop_var: mariadb114_template_dot_my

- name: "provide mysql.cnf configuration file"
  template:
    src: "{{ mariadb114_template_mysql }}"
    dest: "{{ valet_sh_prefix }}/etc/vsh-mariadb114/conf.d/mysql.cnf"
    mode: '0644'
  with_first_found:
    - "macos/mariadb114/mysql.cnf.j2"
  loop_control:
    loop_var: mariadb114_template_mysql

- name: "provide mysqldump.cnf configuration file"
  template:
    src: "{{ mariadb114_template_mysqldump }}"
    dest: "{{ valet_sh_prefix }}/etc/vsh-mariadb114/conf.d/mysqldump.cnf"
    mode: '0644'
  with_first_found:
    - "macos/mariadb114/mysqldump.cnf.j2"
    - "mariadb114/mysqldump.cnf.j2"
  loop_control:
    loop_var: mariadb114_template_mysqldump

- name: "provide mysqld.cnf configuration file"
  template:
    src: "{{ mariadb114_template_mysqld }}"
    dest: "{{ valet_sh_prefix }}/etc/vsh-mariadb114/conf.d/mysqld.cnf"
    mode: '0644'
  with_first_found:
    - "macos/mariadb114/mysqld.cnf.j2"
    - "mariadb114/mysqld.cnf.j2"
  loop_control:
    loop_var: mariadb114_template_mysqld

- name: brew | vsh-mariadb114 | restarted
  shell: "{{ valet_sh_homebrew_bin }} services restart vsh-mariadb114"

- name: wait for mariadb114 to start
  wait_for:
    port: "{{ mariadb_server_114.port }}"
    delay: 5

- name: Set root password
  mysql_user:
    login_host: 127.0.0.1
    login_port: "{{ mariadb_server_114.port }}"
    login_user: root
    login_password: "{{ mariadb_server_default_root_password }}"
    config_file: "/tmp/noexistent.cnf"
    name: "root"
    password: "{{ mariadb_server_default_root_password }}"
    check_implicit_admin: yes
    state: present
