---

- name: set current mariadb base path
  set_fact:
    current_mariadb_base_path: "{{ mariadb_server.base_path }}104"
    current_mariadb_version_key: "10.4"
    current_mariadb_key: "mariadb104"

- name: set current paths
  set_fact:
    current_mariadb_etc_path: "{{ current_mariadb_base_path }}/etc"
    current_mariadb_etc_conf_path: "{{ current_mariadb_base_path }}/etc/conf.d"

- name: "create basic directories"
  file:
    path: "{{ current_mariadb_base_directory }}"
    owner: "valet"
    group: "valet"
    mode: '0755'
    state: directory
  become: true
  with_items:
    - "{{ current_mariadb_base_path }}"
    - "{{ current_mariadb_etc_path }}"
    - "{{ current_mariadb_etc_conf_path }}"
  loop_control:
    loop_var: current_mariadb_base_directory

- name: "Pull {{ current_mariadb_key }} image"
  containers.podman.podman_image:
    name: "{{ mariadb_server_104.image }}"
    pull: true
    state: present

- name: "provide .my.cnf configuration file"
  template:
    src: "ubuntu/{{ current_mariadb_key }}/.my.cnf.j2"
    dest: "{{ current_home }}/.my{{ current_mariadb_version_key }}.cnf"
    mode: '0644'

- name: "provide my.cnf configuration file"
  template:
    src: "ubuntu/{{ current_mariadb_key }}/my.cnf.j2"
    dest: "{{ current_mariadb_etc_path }}/my.cnf"
    owner: "{{ current_user }}"
    group: "{{ current_group }}"
    mode: '0644'
  notify: "systemd | {{ current_mariadb_key }} | restarted"

- name: "provide mysqld.cnf configuration file"
  template:
    src: "ubuntu/{{ current_mariadb_key }}/mysqld.cnf.j2"
    dest: "{{ current_mariadb_etc_conf_path }}/mysqld.cnf"
    owner: "{{ current_user }}"
    group: "{{ current_group }}"
    mode: '0644'
  notify: "systemd | {{ current_mariadb_key }} | restarted"

- name: "ensure user systemd directory exists"
  file:
    path: "{{ current_home }}/.config/systemd/user"
    state: directory
    mode: '0755'

- name: "Provide systemd service for {{ current_mariadb_key }} container"
  ansible.builtin.template:
    src: "ubuntu/systemd/{{ current_mariadb_key }}.service.j2"
    dest: "{{ current_home }}/.config/systemd/user/{{ current_mariadb_key }}.service"
    owner: "{{ current_user }}"
    group: "{{ current_group }}"
    mode: '0644'
  notify: "systemd | {{ current_mariadb_key }} | restarted"

- name: "provide mariadb{{ current_mariadb_version_key }} mysql client"
  template:
    src: "wrapper/mariadb.j2"
    dest: "/usr/local/bin/mariadb{{ current_mariadb_version_key }}"
    owner: root
    group: root
    mode: '0755'
  become: true

- name: "provide mariadump{{ current_mariadb_version_key }} client"
  template:
    src: "wrapper/mariadump.j2"
    dest: "/usr/local/bin/mariadump{{ current_mariadb_version_key }}"
    owner: root
    group: root
    mode: '0755'
  become: true

- name: "provide mariaadmin{{ current_mariadb_version_key }} client"
  template:
    src: "wrapper/mariaadmin.j2"
    dest: "/usr/local/bin/mariaadmin{{ current_mariadb_version_key }}"
    owner: root
    group: root
    mode: '0755'
  become: true

- name: "Ensure {{ current_mariadb_key }} is started"
  systemd:
    name: "{{ current_mariadb_key }}"
    state: started
    daemon_reload: true
    scope: user

- name: Test MariaDB connection and get info
  mysql_info:
    login_host: "127.0.0.1"
    login_port: "{{ mariadb_server_104.port }}"
    login_user: root
    login_password: "{{ mariadb_server.default_root_password }}"
  register: mariadb_status
  until: mariadb_status is succeeded
  retries: 30
  delay: 3

- name: Stop {{ current_mariadb_key }} service after installation
  when: mariadb_status is succeeded
  systemd:
    name: "{{ current_mariadb_key }}"
    state: stopped
    scope: user
