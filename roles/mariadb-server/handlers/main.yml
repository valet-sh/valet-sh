---

- name: "systemd | vsh-mariadb | started"
  ansible.builtin.systemd:
    daemon_reload: true
    name: "vsh-{{ handler_current_service.canonical }}"
    state: started
    scope: "{{ handler_current_service.service.scope }}"

- name: "systemd | vsh-mariadb | stopped"
  ansible.builtin.systemd:
    daemon_reload: true
    name: "vsh-{{ handler_current_service.canonical }}"
    state: stopped
    scope: "{{ handler_current_service.service.scope }}"

- name: "systemd | vsh-mariadb | restarted"
  ansible.builtin.systemd:
    daemon_reload: true
    name: "vsh-{{ handler_current_service.canonical }}"
    state: restarted
    scope: "{{ handler_current_service.service.scope }}"


- name: "container | vsh-mariadb | started"
  apple_container:
    name: "vsh-{{ handler_current_service.canonical }}"
    state: started

- name: "container | vsh-mariadb | stopped"
  apple_container:
    name: "vsh-{{ handler_current_service.canonical }}"
    state: stopped

- name: "container | vsh-mariadb | restarted"
  apple_container:
    name: "vsh-{{ handler_current_service.canonical }}"
    state: restarted

