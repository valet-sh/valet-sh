---
- name: "fail when os is not ubuntu 20.04 or 22.04"
  ansible.builtin.fail:
    msg: "only Ubuntu 20.04 and 22.04 is supported for XPS15 9500!"
  when:
    - ansible_distribution_release != "focal"
    - ansible_distribution_release != "jammy"

- name: ensure universe repository is enabled
  ansible.builtin.shell: "add-apt-repository -y universe"
  become: true

- name: Update all packages to the latest version
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
  become: true

- name: install power management packages
  ansible.builtin.apt:
    name: "{{ packages }}"
  vars:
    packages:
      - thermald
      - powertop
  become: true

- name: ensure tlp packages are not installed
  ansible.builtin.apt:
    name: "{{ packages }}"
    state: absent
  vars:
    packages:
      - tlp
      - tlp-rdw
  become: true

- name: ensure tlp config does not exist
  ansible.builtin.file:
    path: "{{ ubuntu_tlp_config_item }}"
    state: absent
  become: true
  with_items:
    - /etc/tlp.conf
    - /etc/default/tlp
    - /etc/tlp.d
  loop_control:
    loop_var: ubuntu_tlp_config_item

- name: "disable graphic drivers ppa"
  ansible.builtin.apt_repository:
    repo: ppa:graphics-drivers/ppa
    update_cache: true
    state: absent
  become: true

- name: ensure nvidia driver is installed
  ansible.builtin.apt:
    name: "nvidia-driver-515"
    state: present
  become: true

- name: install video codec packages
  ansible.builtin.apt:
    name: "{{ packages }}"
  vars:
    packages:
      - ubuntu-restricted-extras
      - va-driver-all
      - vainfo
      - libva2
      - gstreamer1.0-libav
      - gstreamer1.0-vaapi
  become: true

- ansible.builtin.apt_repository:
    repo: ppa:eh5/pulseaudio-a2dp
    update_cache: true
    state: absent
  become: true

- name: install intel microcode updates
  ansible.builtin.apt:
    name: "{{ packages }}"
  vars:
    packages:
      - intel-microcode
  become: true

- ansible.builtin.include_tasks: "hardware-related/bbswitch.yml"
- name: enable fan speed with lm-sensors
  ansible.builtin.lineinfile:
    path: /etc/modprobe.d/dell-smm-hwmon.conf
    line: "options dell-smm-hwmon restricted=0 force=1"
    create: true
  become: true

- name: enable dell specific module
  ansible.builtin.lineinfile:
    path: /etc/modules
    line: "dell-smm-hwmon"
  become: true

- name: ensure psmouse module is blacklisted
  ansible.builtin.copy:
    content: "blacklist psmouse"
    dest: "/etc/modprobe.d/psmouse.conf"
  become: true

- name: "run update-initramfs -u"
  ansible.builtin.shell: "update-initramfs -u"
  become: true

- name: "switch to intel gpu"
  ansible.builtin.shell: "prime-select intel"
  become: true

- name: "ensure backport-iwlwifi-dkms package is NOT installed on focal"
  ansible.builtin.apt:
    name: "backport-iwlwifi-dkms"
    state: absent
  become: true

