---
- name: Uninstall useless packages
  ansible.builtin.apt:
    name: "{{ absent_packages }}"
    state: absent
  become: true

- name: Install common basic_packages
  ansible.builtin.apt:
    name: "{{ basic_packages }}"
    state: present
  become: true

- name: Install additional packages
  ansible.builtin.apt:
    name: "{{ additional_packages }}"
    state: present
  become: true

- name: Get user home directory
  ansible.builtin.set_fact:
    home_dir: "{{ lookup('env', 'HOME') }}"

- name: Setup swapfile
  ansible.builtin.include_tasks: config-related/setup_swap.yml
- name: Setup Atheros/Qualcom Wifi firmware, if needed
  ansible.builtin.include_tasks: hardware-related/atheros-firmware.yml
- name: Setup Intel/Killer Wifi firmware, if needed
  ansible.builtin.include_tasks: hardware-related/intel-killer-firmware.yml
