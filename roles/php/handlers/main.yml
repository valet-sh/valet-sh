---

- name: "systemd | vsh-php | started"
  ansible.builtin.systemd:
    daemon_reload: true
    name: "vsh-{{ handler_current_service.canonical }}"
    state: started
    scope: "{{ handler_current_service.service.scope }}"
  become: "{{ handler_current_service.service.scope == 'system' }}"

- name: "systemd | vsh-php | stopped"
  ansible.builtin.systemd:
    daemon_reload: true
    name: "vsh-{{ handler_current_service.canonical }}"
    state: stopped
    scope: "{{ handler_current_service.service.scope }}"
  become: "{{ handler_current_service.service.scope == 'system' }}"

- name: "systemd | vsh-php | restarted"
  ansible.builtin.systemd:
    daemon_reload: true
    name: "vsh-{{ handler_current_service.canonical }}"
    state: restarted
    scope: "{{ handler_current_service.service.scope }}"
  become: "{{ handler_current_service.service.scope == 'system' }}"

- name: "systemd | vsh-php | reloaded"
  ansible.builtin.systemd:
    daemon_reload: true
    name: "vsh-{{ handler_current_service.canonical }}"
    state: reloaded
    scope: "{{ handler_current_service.service.scope }}"
  become: "{{ php_item.service.scope == 'system' }}"


- name: brew | vsh-php | restarted
  ansible.builtin.shell: "{{ valet_sh_homebrew_bin }} services restart vsh-{{ handler_current_service.canonical }}"

- name: brew | vsh-php | stopped
  ansible.builtin.shell: "{{ valet_sh_homebrew_bin }} services stop vsh-{{ handler_current_service.canonical }}"

- name: brew | vsh-php | started
  ansible.builtin.shell: "{{ valet_sh_homebrew_bin }} services start vsh-{{ handler_current_service.canonical }}"
