---

- name: "set handler_current_service fact"
  ansible.builtin.set_fact:
    handler_current_service: "{{ current_service }}"

- name: set php_version variable
  ansible.builtin.set_fact:
    php_version: "{{ current_service.version }}"

- name: "ensure '{{ current_service.service.name }}' is installed"
  homebrew:
    name: "{{ current_service.service.name }}"
    state: present

- name: "ensure directory '{{ valet_sh_homebrew_prefix }}/etc/{{ current_service.service.name }}/mods-available' exists"
  ansible.builtin.file:
    path: "{{ valet_sh_homebrew_prefix }}/etc/{{ current_service.service.name }}/mods-available"
    state: directory

- name: ensure xdebug.ini configuration is deleted
  ansible.builtin.file:
    path: "{{ valet_sh_homebrew_prefix }}/etc/{{ current_service.service.name }}/mods-available/xdebug.ini"
    state: absent
  become: true

- name: ensure xdebug2 config is deployed
  ansible.builtin.template:
    src: "macos/xdebug2.ini.j2"
    dest: "{{ valet_sh_homebrew_prefix }}/etc/{{ current_service.service.name }}/mods-available/xdebug2.ini"
    mode: "0644"
  when: "php_version in native_xdebug2_versions"

- name: ensure xdebug3 config is deployed
  ansible.builtin.template:
    src: "macos/xdebug3.ini.j2"
    dest: "{{ valet_sh_homebrew_prefix }}/etc/{{ current_service.service.name }}/mods-available/xdebug3.ini"
    mode: "0644"
  when: "php_version in native_xdebug3_versions"

- name: ensure compiled xdebug2 config is deployed
  ansible.builtin.template:
    src: "macos/xdebug2-compiled.ini.j2"
    dest: "{{ valet_sh_homebrew_prefix }}/etc/{{ current_service.service.name }}/mods-available/xdebug2.ini"
    mode: "0644"
  when: "php_version in compiled_xdebug2_versions"

- name: "ensure imagick config file exists"
  ansible.builtin.lineinfile:
    path: "{{ valet_sh_homebrew_prefix }}/etc/{{ current_service.service.name }}/mods-available/imagick.ini"
    line: "extension=imagick.so"
    create: true

- name: "ensure imagick module is enabled"
  ansible.builtin.file:
    src: "{{ valet_sh_homebrew_prefix }}/etc/{{ current_service.service.name }}/mods-available/imagick.ini"
    dest: "{{ valet_sh_homebrew_prefix }}/etc/{{ current_service.service.name }}/conf.d/imagick.ini"
    state: link
  notify: "brew | vsh-php | restarted"

- name: get stat for error.log file
  ansible.builtin.stat:
    path: "{{ php_error_log_path }}"
  register: php_error_log_file_obj

- name: create php_errors.log file
  ansible.builtin.file:
    dest: "{{ php_error_log_path }}"
    state: "{{ 'file' if php_error_log_file_obj.stat.exists else 'touch' }}"
    mode: "0755"
  become: true

- name: set PATH env variable
  ansible.builtin.lineinfile:
    path: "{{ valet_sh_homebrew_prefix }}/etc/{{ current_service.service.name }}/php-fpm.d/www.conf"
    regexp: ";env[PATH] = /usr/local/bin:/usr/bin:/bin"
    line: "env[PATH] = /usr/local/bin:/usr/bin:/bin"
  when: current_service != "vsh-php56"

- name: set PATH env variable for php5.6
  ansible.builtin.lineinfile:
    path: "{{ valet_sh_homebrew_prefix }}/etc/{{ current_service.service.name }}/php-fpm.conf"
    regexp: ";env[PATH] = /usr/local/bin:/usr/bin:/bin"
    line: "env[PATH] = /usr/local/bin:/usr/bin:/bin"
  when: current_service == "vsh-php56"

- name: ensure php configuration is up2date
  ansible.builtin.template:
    src: "macos/valet-sh.conf.j2"
    dest: "{{ valet_sh_homebrew_prefix }}/etc/{{ current_service.service.name }}/conf.d/95-valet-sh.ini"
    mode: "0644"
  notify: "brew | vsh-php | restarted"

- name: "get stat for '{{ valet_sh_homebrew_prefix }}/bin/default-php'"
  ansible.builtin.stat:
    path: "{{ valet_sh_homebrew_prefix }}/bin/default-php"
  register: php_default_symlink_obj

- name: "create symlink for default php"
  ansible.builtin.file:
    src: "{{ valet_sh_homebrew_prefix }}/bin/php{{ current_service.version }}"
    dest: "{{ valet_sh_homebrew_prefix }}/bin/default-php"
    state: link
    force: true
  when:
    - php_default_symlink_obj.stat is defined
    - not php_default_symlink_obj.stat.exists|bool

- name: ensure php wrapper script is up2date
  ansible.builtin.template:
    src: "macos/php-wrapper.j2"
    dest: "{{ valet_sh_homebrew_prefix }}/bin/php"
    mode: "0755"
    force: true

- name: "Mark vsh-{{ current_service.canonical }} as installed in the services file"
  vsh_bundle_state:
    action: "installed"
    canonical_names: "{{ current_service.canonical }}"

- name: "Flush handlers"
  ansible.builtin.meta: flush_handlers
