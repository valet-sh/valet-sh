---

- name: set php_version variable
  ansible.builtin.set_fact:
    php_version: "{{ current_service.version }}"

- name: "override default configuration for current php"
  ansible.builtin.include_tasks: override-config.yml

- name: "ensure 'php{{ php_version }}-fpm' is stopped"
  ansible.builtin.systemd:
    name: "php{{ php_version }}-fpm"
    state: stopped
  become: true

- name: "uninstall php{{ php_version }}-common"
  ansible.builtin.apt:
    name: "php{{ php_version }}-common"
    state: absent
    purge: true
  become: true

- name: create specific php module list
  ansible.builtin.set_fact:
    php_specific_modules: "{{ php_modules | map('regex_replace', '^(.*)$', php_version_string + '-\\1') | list }}"

- name: "uninstall {{ php_version_string }} modules"
  ansible.builtin.apt:
    name: "{{ php_specific_modules }}"
    state: absent
  become: true

- name: ensure php configuration is absent
  ansible.builtin.file:
    path: "{{ php_version_path_item }}"
    state: absent
  with_items:
    - "/etc/php/{{ php_version }}"
    - "/etc/apt/preferences.d/valet-sh-php{{ php_version | replace('.', '-') }}-xdebug"
    - "/etc/php"
  loop_control:
    loop_var: php_version_path_item
  become: true

- name: "ensure php repository is removed from sources.list.d'"
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/php.list
    state: absent
  become: true

- name: "ensure debsurorg-archive-keyring is removed"
  ansible.builtin.apt:
    name: debsuryorg-archive-keyring
    purge: true
    state: absent
  become: true

- name: "Remove vsh-{{ current_service.canonical }} from installed services"
  vsh_bundle_state:
    action: "uninstalled"
    canonical_names: "{{ current_service.canonical }}"
