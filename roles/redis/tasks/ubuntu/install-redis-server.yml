---

- name: Ensure redis-tools are installed natively
  ansible.builtin.apt:
    name: "redis-tools"
    state: present
  become: true

- name: Pull redis-server image
  containers.podman.podman_image:
    name: "{{ current_redis_service.configuration.docker_image }}"
    pull: true
    state: present

- name: "ensure user systemd directory exists"
  ansible.builtin.file:
    path: "{{ current_home }}/.config/systemd/user"
    state: directory
    mode: "0755"

- name: Provide systemd service for vsh-redis-server container
  ansible.builtin.template:
    src: "systemd/redis.service.j2"
    dest: "{{ current_home }}/.config/systemd/user/vsh-{{ current_redis_service.canonical }}.service"
    owner: "{{ current_user }}"
    group: "{{ current_group }}"
    mode: "0644"
  notify: "systemd | vsh-redis-server | restarted"

- name: "Mark vsh-{{ current_redis_service.canonical }} as installed in the services file"
  vsh_bundle_state:
    action: "installed"
    canonical_names: "{{ current_redis_service.canonical }}"
