---

- name: "systemd | vsh-redis-server | started"
  ansible.builtin.systemd:
    daemon_reload: true
    name: "{{ redis_item.service.name }}"
    state: started
    scope: "{{ redis_item.service.scope }}"
  loop: "{{ valet_resolved_service.services | selectattr('canonical', 'match', '^redis.*') }}"
  loop_control:
    loop_var: redis_item
  listen: "systemd | vsh-redis-server | started"

- name: "systemd | vsh-redis-server | stopped"
  ansible.builtin.systemd:
    daemon_reload: true
    name: "{{ redis_item.service.name }}"
    state: stopped
    scope: "{{ redis_item.service.scope }}"
  loop: "{{ valet_resolved_service.services | selectattr('canonical', 'match', '^redis.*') }}"
  loop_control:
    loop_var: redis_item
  listen: "systemd | vsh-redis-server | started"

- name: "systemd | vsh-redis-server | restarted"
  ansible.builtin.systemd:
    daemon_reload: true
    name: "{{ redis_item.service.name }}"
    state: restarted
    scope: "{{ redis_item.service.scope }}"
  loop: "{{ valet_resolved_service.services | selectattr('canonical', 'match', '^redis.*') }}"
  loop_control:
    loop_var: redis_item
  listen: "systemd | vsh-redis-server | started"

- name: "systemd | vsh-redis-server | reloaded"
  ansible.builtin.systemd:
    daemon_reload: true
    name: "{{ redis_item.service.name }}"
    state: restarted
    scope: "{{ redis_item.service.scope }}"
  loop: "{{ valet_resolved_service.services | selectattr('canonical', 'match', '^redis.*') }}"
  loop_control:
    loop_var: redis_item
  listen: "systemd | vsh-redis-server | restarted"


- name: brew | redis | started
  ansible.builtin.shell: "{{ valet_sh_homebrew_bin }} services start redis"
- name: brew | redis | stopped
  ansible.builtin.shell: "{{ valet_sh_homebrew_bin }} services stop redis"
- name: brew | redis | restarted
  ansible.builtin.shell: "{{ valet_sh_homebrew_bin }} services restart redis"
