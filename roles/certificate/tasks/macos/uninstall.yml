---

- name: "ca | remove CA certificate from macOS keychain"
  ansible.builtin.shell: 'security delete-certificate -c "valet.sh Development CA" /Library/Keychains/System.keychain'
  failed_when: false
  become: true

- name: "ca | remove generated CA files and base directories"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  with_items:
    - "{{ certificate_ca_cert_file }}"
    - "{{ certificate_ca_key_file }}"
    - "{{ certificate_ca_cert_path }}"
    - "{{ certificate_server_cert_path }}"
    - "{{ certificate_base_path }}"
  become: true

- name: Mark certificate as uninstalled
  vsh_bundle_state:
    action: "uninstalled"
    name: "certificate"
