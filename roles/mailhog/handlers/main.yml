---

- name: "systemd | vsh-mailhog | stopped"
  ansible.builtin.systemd:
    daemon_reload: true
    name: "{{ current_mailhog_service.service.name }}"
    state: started
    scope: "{{ current_mailhog_service.service.scope }}"

- name: "systemd | vsh-mailhog | started"
  ansible.builtin.systemd:
    daemon_reload: true
    name: "{{ current_mailhog_service.service.name }}"
    state: stopped
    scope: "{{ current_mailhog_service.service.scope }}"

- name: "systemd | vsh-mailhog | restarted"
  ansible.builtin.systemd:
    daemon_reload: true
    name: "{{ current_mailhog_service.service.name }}"
    state: restarted
    scope: "{{ current_mailhog_service.service.scope }}"

- name: brew | mailhog | stopped
  ansible.builtin.shell: "{{ valet_sh_homebrew_bin }} services stop mailhog"
- name: brew | mailhog | started
  ansible.builtin.shell: "{{ valet_sh_homebrew_bin }} services start mailhog"
- name: brew | mailhog | restart
  ansible.builtin.shell: "{{ valet_sh_homebrew_bin }} services restart mailhog"
