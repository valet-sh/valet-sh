---

- name: "ensure mailhog is installed"
  shell: "{{ valet_sh_homebrew_bin }} uninstall mailhog"
  ignore_errors: true

- name: "ensure vsh-mailhog is uninstalled"
  shell: "{{ valet_sh_homebrew_bin }} uninstall vsh-mailhog"
  ignore_errors: true

- name: "ensure mailpit is installed"
  shell: "{{ valet_sh_homebrew_bin }} install mailpit"

- name: set 'cert_prefix' variable
  set_fact:
    cert_prefix: "mailhog"

- name: "generate ssl-certificate for {{ cert_prefix }}"
  include_role:
    name: certificate
    public: true

- name: provide init script for mailhog
  template:
    src: "mailhog.conf.j2"
    dest: "{{ valet_sh_prefix }}/etc/nginx/conf.d/mailhog.conf"
    mode: '0644'
  notify: brew | nginx | restarted

- name: unset 'cert_prefix' variable
  set_fact:
    cert_prefix: "{{ non_existent|default(None) }}"

- name: set 'cert_prefix' variable
  set_fact:
    cert_prefix: "mailpit"

- name: "generate ssl-certificate for {{ cert_prefix }}"
  include_role:
    name: certificate
    public: true

- name: provide init script for mailpit
  template:
    src: "mailpit.conf.j2"
    dest: "{{ valet_sh_prefix }}/etc/nginx/conf.d/mailpit.conf"
    mode: '0644'
  notify: brew | nginx | restarted

- name: unset 'cert_prefix' variable
  set_fact:
    cert_prefix: "{{ non_existent|default(None) }}"

- name: brew | mailpit | start
  shell: "{{ valet_sh_homebrew_bin }} services start mailpit"
