---

- name: Pull mailhog image
  containers.podman.podman_image:
    name: "docker.io/mailhog/mailhog:latest"
    pull: true
    state: present

- name: "ensure user systemd directory exists"
  file:
    path: "{{ current_home }}/.config/systemd/user"
    state: directory
    mode: '0755'

- name: provide systemd service for mailhog container
  ansible.builtin.template:
    src: "mailhog.service.j2"
    dest: "{{ current_home }}/.config/systemd/user/mailhog.service"
    owner: "{{ current_user }}"
    group: "{{ current_group }}"
    mode: '0644'
  notify: "systemd | mailhog | restarted"

- name: set 'cert_prefix' variable
  set_fact:
    cert_prefix: "mailhog"

- name: "generate ssl-certificate for {{ cert_prefix }}"
  include_role:
    name: certificate
    public: true

- name: provide init script for mailhog
  template:
    src: "mailhog.conf.j2"
    dest: "/etc/nginx/conf.d/mailhog.conf"
    owner: root
    group: root
    mode: '0644'
  notify: systemd | nginx | reloaded
  become: true

- name: unset 'cert_prefix' variable
  set_fact:
    cert_prefix: "{{ non_existent|default(None) }}"

- name: ensure mailhog is enabled and started
  systemd:
    daemon_reload: true
    name: mailhog
    enabled: true
    state: started
    scope: user
