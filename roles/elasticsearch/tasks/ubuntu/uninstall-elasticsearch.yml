---

- name: "Ensure that vsh-{{ current_elasticsearch_service.canonical }} container is stopped"
  ansible.builtin.systemd:
    name: "{{ current_elasticsearch_service.service.name }}"
    state: stopped
    daemon_reload: true
    scope: "{{ current_elasticsearch_service.service.scope }}"
  ignore_errors: true

- name: "Remove vsh-{{ current_elasticsearch_service.canonical }} container"
  containers.podman.podman_container:
    name: "vsh-{{ current_elasticsearch_service.canonical }}"
    state: absent

- name: "Remove vsh-{{ current_elasticsearch_service.canonical }} volumes"
  containers.podman.podman_volume:
    name: "{{ item }}"
    state: absent
  loop:
    - "vsh-{{ current_elasticsearch_service.canonical }}-data"
    - "vsh-{{ current_elasticsearch_service.canonical }}-plugins"
  when: "'--purge' in valet_cli_opts"

- name: "Remove vsh-{{ current_elasticsearch_service.canonical }} systemd service"
  ansible.builtin.file:
    path: "{{ current_home }}/.config/systemd/user/{{ current_elasticsearch_service.service.name }}.service"
    state: absent

- name: "Remove vsh-{{ current_elasticsearch_service.canonical }} default.target.wants symlink"
  ansible.builtin.file:
    path: "{{ current_home }}/.config/systemd/user/default.target.wants/{{ current_elasticsearch_service.service.name }}.service"
    state: absent

- name: "Reload Systemd"
  ansible.builtin.systemd:
    daemon_reload: true
    scope: "{{ current_elasticsearch_service.service.scope }}"

- name: "Remove vsh-{{ current_elasticsearch_service.canonical }} configurations"
  ansible.builtin.file:
    path: "{{ current_elasticsearch_service.configuration.base_path }}"
    state: absent

- name: "Remove vsh-{{ current_elasticsearch_service.canonical }} image"
  containers.podman.podman_image:
    name: "{{ current_elasticsearch_service.configuration.docker_image }}"
    state: absent
    force: true
  when: "'--purge' in valet_cli_opts"

- name: "Remove vsh-{{ current_elasticsearch_service.canonical }} from installed services"
  vsh_bundle_state:
    action: "uninstalled"
    canonical_names: "{{ current_elasticsearch_service.canonical }}"

- name: "Flush handlers"
  flush_handlers:
