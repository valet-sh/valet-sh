---

- name: "ensure 'vsh-{{ current_service.canonical }}' is absent"
  apple_container:
    name: "vsh-{{ current_service.canonical }}"
    state: absent

- name: Set container autostart
  ansible.builtin.lineinfile:
    path: /usr/local/valet-sh/etc/container-autostart
    line: "vsh-{{ current_service.canonical }}"
    state: "absent"

- name: "Remove vsh-{{ current_service.canonical }} volumes"
  apple_volume:
    name: "{{ current_service_volume_item }}"
    state: absent
  loop:
    - "vsh-{{ current_service.canonical }}-data"
  loop_control:
    loop_var: current_service_volume_item
  when: "'--purge' in valet_cli_opts"

- name: "Remove vsh-{{ current_service.canonical }} configurations"
  ansible.builtin.file:
    path: "{{ current_service.configuration.base_path }}"
    state: absent

- name: "Remove vsh-{{ current_service.canonical }} image"
  apple_image:
    name: "{{ current_service.configuration.docker_image }}"
    state: absent
  when: "'--purge' in valet_cli_opts"

- name: "Remove vsh-{{ current_service.canonical }} from installed services"
  vsh_bundle_state:
    action: "uninstalled"
    canonical_names: "{{ current_service.canonical }}"

- name: "Flush handlers"
  ansible.builtin.meta: flush_handlers
