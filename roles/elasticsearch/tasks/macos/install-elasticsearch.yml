---

- name: "set handler_current_service fact"
  ansible.builtin.set_fact:
    handler_current_service: "{{ current_service }}"

- name: "Pull image '{{ current_service.configuration.docker_image }}'"
  apple_image:
    name: "{{ current_service.configuration.docker_image }}"
    pull: true
    state: present

- name: "ensure volume '{{ current_service.service.name }}-data' exists"
  apple_volume:
    name: "{{ current_service.service.name }}-data"
    state: present
  register: data_volume_obj

- name: "fix volume permissions for '{{ current_service.service.name }}-data'"
  apple_container:
    name: vsh-volume-fix
    image: alpine
    state: started
    remove: true
    detach: false
    volumes:
      - "{{ current_service.service.name }}-data:/data"
    command:
      - chown
      - -R
      - "1000:"
      - /data
  when: data_volume_obj.changed

- name: "Create vsh-{{ current_service.canonical }} config directory"
  ansible.builtin.file:
    path: "{{ current_service.configuration.base_path }}/config"
    owner: "{{ current_user }}"
    group: "{{ current_group }}"
    mode: "0755"
    state: directory

- name: "provide vsh-{{ current_service.canonical }} configuration"
  ansible.builtin.template:
    src: "config/{{ current_service.canonical }}.yml.j2"
    dest: "{{ current_service.configuration.base_path }}/config/elasticsearch.yml"
    mode: "0644"
  notify: "container | vsh-elasticsearch | restarted"

- name: "ensure container 'vsh-{{ current_service.canonical }}' is started"
  apple_container:
    name: "vsh-{{ current_service.canonical }}"
    image: "{{ current_service.configuration.docker_image }}"
    state: started
    cpus: "{{ current_service.configuration.limits.cpus | default(2) }}"
    memory: "{{ current_service.configuration.limits.memory | default('2g') }}"
    user: "1000:1000"
    volumes:
      - "vsh-{{ current_service.canonical }}-data:/usr/share/elasticsearch/data"
      - "{{ current_service.configuration.base_path }}/config/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:Z"
    env:
      - "discovery.type=single-node"
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - "xpack.security.enabled=false"

- name: "Wait for vsh-{{ current_service.canonical }} to be ready 'http://{{ current_service.service.name }}.vsh:{{ current_service.configuration.ports.http }}/_cluster/health'"
  ansible.builtin.uri:
    url: "http://{{ current_service.service.name }}.vsh:{{ current_service.configuration.ports.http }}/_cluster/health"
    method: GET
    status_code: 200
  register: result
  until: result.status == 200
  retries: 15
  delay: 3

- name: "list installed plugins"
  apple_container_exec:
    name: "vsh-{{ current_service.canonical }}"
    command: "{{ current_service.configuration.plugins.list_command }}"
  register: installed_plugins

- name: "install plugins"
  apple_container_exec:
    name: "vsh-{{ current_service.canonical }}"
    command: "{{ current_service.configuration.plugins.install_command }} {{ current_elasticsearch_plugin.name }}"
  with_items: "{{ current_service.configuration.plugins.default_plugins }}"
  loop_control:
    loop_var: current_elasticsearch_plugin
  notify: "container | vsh-elasticsearch | restarted"
  when:
    - current_elasticsearch_plugin.name not in installed_plugins.stdout_lines
    - current_elasticsearch_plugin.url is not defined
    - "current_elasticsearch_plugin.name not in ' '.join(installed_plugins.stdout_lines | map('regex_replace', '^\\s*-\\s*', ''))"

- name: "install plugins from url"
  apple_container_exec:
    name: "vsh-{{ current_service.canonical }}"
    command: "{{ current_service.configuration.plugins.install_command }} {{ current_elasticsearch_plugin.name }} --url {{ current_elasticsearch_plugin.url }}"
  with_items: "{{ current_service.configuration.plugins.default_plugins }}"
  loop_control:
    loop_var: current_elasticsearch_plugin
  notify: "container | vsh-elasticsearch | restarted"
  when:
    - current_elasticsearch_plugin.name not in installed_plugins.stdout_lines
    - current_elasticsearch_plugin.url is defined
    - "current_elasticsearch_plugin.name not in ' '.join(installed_plugins.stdout_lines | map('regex_replace', '^\\s*-\\s*', ''))"

- name: "provide {{ current_service.canonical }} configuration"
  template:
    src: "nginx/elasticsearch.conf.j2"
    dest: "{{ valet_sh_homebrew_prefix }}/etc/nginx/conf.d/{{ current_service.canonical }}.conf"
    mode: "0644"
  notify: brew | nginx | restarted

- name: "Flush handlers"
  ansible.builtin.meta: flush_handlers

- name: "Get desired state of vsh-{{ current_service.canonical }} from services file"
  vsh_bundle_service_state_info:
    name: "{{ current_service.canonical }}"
  register: current_service_state

- name: "If desired state is unknown, set it to enabled"
  vsh_bundle_state:
    action: "initialize_empty"
    canonical_names: "{{ current_service.canonical }}"
  when: current_service_state.state == "unknown"

- name: "Update current_service_state after initialization"
  ansible.builtin.set_fact:
    current_service_state: "{{ current_service_state | combine({'state': 'enabled'}) }}"
  when: current_service_state.state == "unknown"

- name: "Ensure target state of vsh-{{ current_service.canonical }} is set"
  apple_container:
    name: "vsh-{{ current_service.canonical }}"
    state: "{{ 'started' if current_service_state.state == 'enabled' else 'stopped' }}"

- name: Set container autostart
  ansible.builtin.lineinfile:
    path: /usr/local/valet-sh/etc/container-autostart
    line: "vsh-{{ current_service.canonical }}"
    state: "{{ 'present' if current_service_state.state == 'enabled' else 'absent' }}"

- name: "Mark vsh-{{ current_service.canonical }} as installed in the services file"
  vsh_bundle_state:
    action: "installed"
    canonical_names: "{{ current_service.canonical }}"
