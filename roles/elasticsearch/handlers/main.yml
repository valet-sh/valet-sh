---

- name: "systemd | vsh-elasticsearch | started"
  ansible.builtin.systemd:
    daemon_reload: true
    name: "{{ elasticsearch_item.service.name }}"
    state: started
    scope: "{{ elasticsearch_item.service.scope }}"
  loop: "{{ valet_resolved_service.services | selectattr('canonical', 'match', '^elasticsearch.*') }}"
  loop_control:
    loop_var: elasticsearch_item
  listen: "systemd | vsh-elasticsearch | started"

- name: "systemd | vsh-elasticsearch | stopped"
  ansible.builtin.systemd:
    daemon_reload: true
    name: "{{ elasticsearch_item.service.name }}"
    state: stopped
    scope: "{{ elasticsearch_item.service.scope }}"
  loop: "{{ valet_resolved_service.services | selectattr('canonical', 'match', '^elasticsearch.*') }}"
  loop_control:
    loop_var: elasticsearch_item
  listen: "systemd | vsh-elasticsearch | stopped"

- name: "systemd | vsh-elasticsearch | restarted"
  ansible.builtin.systemd:
    daemon_reload: true
    name: "{{ elasticsearch_item.service.name }}"
    state: restarted
    scope: "{{ elasticsearch_item.service.scope }}"
  loop: "{{ valet_resolved_service.services | selectattr('canonical', 'match', '^elasticsearch.*') }}"
  loop_control:
    loop_var: elasticsearch_item
  listen: "systemd | vsh-elasticsearch | restarted"

- name: "systemd | vsh-elasticsearch | reloaded"
  ansible.builtin.systemd:
    daemon_reload: true
    name: "{{ elasticsearch_item.service.name }}"
    state: restarted
    scope: "{{ elasticsearch_item.service.scope }}"
  loop: "{{ valet_resolved_service.services | selectattr('canonical', 'match', '^elasticsearch.*') }}"
  loop_control:
    loop_var: elasticsearch_item
  listen: "systemd | vsh-elasticsearch | reloaded"

- name: brew | vsh-elasticsearch5 | restarted
  ansible.builtin.shell: "{{ valet_sh_homebrew_bin }} services restart vsh-elasticsearch5"
- name: brew | vsh-elasticsearch6 | restarted
  ansible.builtin.shell: "{{ valet_sh_homebrew_bin }} services restart vsh-elasticsearch6"
- name: brew | vsh-elasticsearch7 | restarted
  ansible.builtin.shell: "{{ valet_sh_homebrew_bin }} services restart vsh-elasticsearch7"
- name: brew | vsh-elasticsearch8 | restarted
  ansible.builtin.shell: "{{ valet_sh_homebrew_bin }} services restart vsh-elasticsearch8"
