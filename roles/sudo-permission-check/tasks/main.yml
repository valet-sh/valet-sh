---

- name: "set 'ansible_become_exe' based on current os"
  set_fact:
    ansible_become_exe: "{{ '/usr/bin/sudo.ws' if (ansible_facts['distribution'] == 'Ubuntu' and ansible_facts['distribution_version'] == '26.04') else '/usr/bin/sudo' }}"

- name: Reset sudo session
  ansible.builtin.command: sudo -k

- name: Check sudo permissions
  ansible.builtin.command: echo "check sudo permissions"
  become: true
  timeout: 3
  changed_when: false
  failed_when: false
  register: sudo_permission_check_obj
  ignore_errors: true

- name: fail when password was wrong
  ansible.builtin.fail:
    msg: "invalid password!"
  when: sudo_permission_check_obj is not defined or sudo_permission_check_obj.rc is not defined or sudo_permission_check_obj.rc != 0
