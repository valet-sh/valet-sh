---

- name: "systemd | vsh-nginx | started"
  ansible.builtin.systemd:
    daemon_reload: true
    name: "{{ nginx_item.service.name }}"
    state: started
    scope: "{{ nginx_item.service.scope }}"
  loop: "{{ vsh_resolver.services | selectattr('canonical', 'match', '^nginx.*') }}"
  become: "{{ nginx_item.service.scope == 'system' }}"
  loop_control:
    loop_var: nginx_item
  listen: "systemd | vsh-nginx | started"

- name: "systemd | vsh-nginx | stopped"
  ansible.builtin.systemd:
    daemon_reload: true
    name: "{{ nginx_item.service.name }}"
    state: stopped
    scope: "{{ nginx_item.service.scope }}"
  become: "{{ nginx_item.service.scope == 'system' }}"
  loop: "{{ vsh_resolver.services | selectattr('canonical', 'match', '^nginx.*') }}"
  loop_control:
    loop_var: nginx_item
  listen: "systemd | vsh-nginx | stopped"

- name: "systemd | vsh-nginx | restarted"
  ansible.builtin.systemd:
    daemon_reload: true
    name: "{{ nginx_item.service.name }}"
    state: restarted
    scope: "{{ nginx_item.service.scope }}"
  become: "{{ nginx_item.service.scope == 'system' }}"
  loop: "{{ vsh_resolver.services | selectattr('canonical', 'match', '^nginx.*') }}"
  loop_control:
    loop_var: nginx_item
  listen: "systemd | vsh-nginx | restarted"

- name: "systemd | vsh-nginx | reloaded"
  ansible.builtin.systemd:
    daemon_reload: true
    name: "{{ nginx_item.service.name }}"
    state: restarted
    scope: "{{ nginx_item.service.scope }}"
  become: "{{ nginx_item.service.scope == 'system' }}"
  loop: "{{ vsh_resolver.services | selectattr('canonical', 'match', '^nginx.*') }}"
  loop_control:
    loop_var: nginx_item
  listen: "systemd | vsh-nginx | reloaded"

- name: brew | nginx | restarted
  ansible.builtin.shell: "{{ valet_sh_homebrew_bin_sudo }} services restart nginx"

- name: brew | nginx | stopped
  ansible.builtin.shell: "{{ valet_sh_homebrew_bin_sudo }} services stop nginx"

- name: brew | nginx | started
  ansible.builtin.shell: "{{ valet_sh_homebrew_bin_sudo }} services start nginx"
