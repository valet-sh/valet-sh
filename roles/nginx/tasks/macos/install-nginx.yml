---

- name: "ensure nginx is installed"
  homebrew:
    name: nginx
    state: present

#- name: "ensure nginx is installed"
#  ansible.builtin.shell: "{{ valet_sh_homebrew_bin }} install nginx"

- name: Generate dhparams file
  ansible.builtin.shell: "openssl dhparam -out {{ nginx_dhparams_file }} {{ nginx_dhparams_keysize }}"
  args:
    creates: "{{ nginx_dhparams_file }}"

- name: Override default config
  ansible.builtin.template:
    src: "nginx.conf.j2"
    dest: "{{ valet_sh_homebrew_prefix }}/etc/nginx/nginx.conf"
    mode: "0644"
  notify: brew | nginx | restarted

- name: Create nginx conf.d dir
  ansible.builtin.file:
    path: "{{ valet_sh_homebrew_prefix }}/etc/nginx/conf.d"
    state: directory
    mode: "0755"

- name: Create nginx stream.d dir
  ansible.builtin.file:
    path: "/opt/homebrew/etc/nginx/stream.d"
    state: directory
    mode: "0755"

- name: "ensure vhost directory '{{ valet_sh_default_vhost_root }}' exists"
  ansible.builtin.file:
    path: "{{ valet_sh_default_vhost_root }}"
    state: directory
    owner: "{{ current_user }}"
    group: "{{ current_group }}"
    mode: "0755"
  become: true

- name: "provide default vhost template"
  ansible.builtin.template:
    src: "default-vhost-index.html.j2"
    dest: "{{ valet_sh_default_vhost_root }}/index.html"
    owner: "{{ current_user }}"
    group: "{{ current_group }}"
    mode: "0644"
    force: false
  become: true

- name: "Mark nginx as installed in the services file"
  vsh_bundle_state:
    action: "installed"
    canonical_names: "nginx"

- name: "Mark nginx as enabled in the services file"
  vsh_bundle_state:
    action: "enabled"
    canonical_names: "nginx"

- name: set 'cert_prefix' variable
  ansible.builtin.set_fact:
    cert_prefix: "{{ valet_sh_default_vhost_domain }}"

- name: "generate ssl-certificate for {{ valet_sh_default_vhost_domain }}"
  ansible.builtin.include_role:
    name: certificate
    public: true
  vars:
    cert_prefix: "{{ valet_sh_default_vhost_domain }}"

- name: "provide default vhost"
  ansible.builtin.template:
    src: "default-vhost.conf.j2"
    dest: "/opt/homebrew/etc/nginx/conf.d/{{ valet_sh_default_vhost_domain }}.{{ development_tld }}.conf"
    mode: "0644"
  notify: brew | nginx | restarted

- name: unset 'cert_prefix' variable
  ansible.builtin.set_fact:
    cert_prefix: "{{ non_existent | default(None) }}"

- name: "read nginx configurations in '/opt/homebrew/etc/nginx/conf.d/'"
  ansible.builtin.find:
    paths: "/opt/homebrew/etc/nginx/conf.d/"
    recurse: false
    file_type: file
  register: nginx_vhosts_obj

- ansible.builtin.include_tasks: sub-migrate-config.yml
  with_items: "{{ nginx_vhosts_obj.files }}"
  loop_control:
    loop_var: nginx_vhosts_obj_item
