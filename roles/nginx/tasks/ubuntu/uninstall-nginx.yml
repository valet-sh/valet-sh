---

- name: "ensure nginx is stopped"
  ansible.builtin.systemd:
    name: "nginx"
    state: stopped
  become: true
  ignore_errors: true

- name: "ensure nginx is uninstalled"
  ansible.builtin.apt:
    name: "{{ nginx_packages }}"
    state: absent
    purge: true
    autoremove: true
  loop_control:
    loop_var: nginx_packages
  loop:
    - "nginx"
    - "nginx-full"
    - "nginx-common"
    - "nginx-core"
  become: true

- name: "ensure nginx related files are absent"
  ansible.builtin.file:
    path: "{{ valet_sh_service_nginx_item }}"
    state: absent
  become: true
  with_items:
    - "/etc/nginx/stream.d"
    - "/etc/nginx/conf.d"
    - "{{ valet_sh_default_vhost_root }}"

    - "/etc/nginx/"
    - "/var/log/nginx"
  loop_control:
    loop_var: valet_sh_service_nginx_item

- name: "Remove nginx from installed services"
  vsh_bundle_state:
    action: "remove_installed"
    canonical_names: "nginx"
