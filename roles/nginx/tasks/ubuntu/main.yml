---

- name: "install nginx"
  ansible.builtin.include_tasks: install-nginx.yml
  when:
    - valet_install_core_roles_to_install is defined
    - valet_install_core_roles_to_install | length > 0

- name: "uninstall nginx"
  ansible.builtin.include_tasks: uninstall-nginx.yml
  when:
    - valet_uninstall_services is defined
    - valet_uninstall_services | length > 0
