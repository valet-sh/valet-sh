---

- name: "workflows » neos » services | detect search engine"
  ansible.builtin.set_fact:
    search_engine: "{{ item.key }}"
    search_engine_version: "{{ item.value.version }}"
    search_engine_config: "{{ item.value }}"
  with_dict: "{{ valet_sh_project_vars.services | default({}) }}"
  when: item.key in ['elasticsearch', 'opensearch']

- block:
    - name: "workflows » neos » services » search_engine | check if {{ search_engine }}{{ search_engine_version }} is installed"
      vsh_bundle_install_state_info:
        state: "present"
        name: "{{ search_engine }}{{ search_engine_version }}"
      register: search_engine_installed

    - name: "workflows » neos » services » search_engine | resolve {{ search_engine }}{{ search_engine_version }} service"
      vsh_bundle_resolver:
        name: "{{ search_engine }}{{ search_engine_version }}"
        current_os: "{{ current_os }}"
      register: search_engine_install

    - name: "workflows » neos » services » search_engine | read plugins from .valet-sh.yml"
      ansible.builtin.set_fact:
        search_engine_plugins: "{{ search_engine_config.plugins | default([]) }}"

    - name: "workflows » neos » services » search_engine | include service-specific roles"
      ansible.builtin.include_role:
        name: "{{ search_engine }}"
      vars:
        valet_resolved_service: "{{ search_engine_install }}"
        valet_install_services: ["{{ search_engine }}{{ search_engine_version }}"]
      when: search_engine_installed.kinds | length == 0

    - name: "workflows » neos » services » search_engine | ensure {{ search_engine }}{{ search_engine_version }} is started and enabled"
      ansible.builtin.systemd:
        name: "vsh-{{ search_engine }}{{ search_engine_version }}"
        state: started
        enabled: true
        scope: user

    - name: "workflows » neos » services » search_engine | set {{ search_engine }}{{ search_engine_version }} as enabled"
      vsh_bundle_state:
        action: "enabled"
        canonical_names: "{{ search_engine }}{{ search_engine_version }}"

    - name: "workflows » neos » services » search_engine | wait for {{ search_engine }} to be reachable"
      ansible.builtin.wait_for:
        port: "{{ search_engine_install.services[0].configuration.ports.http }}"
        delay: 5

    - name: "workflows » neos » services » search_engine | check if plugins are already installed"
      containers.podman.podman_container_exec:
        name: "vsh-{{ search_engine }}{{ search_engine_version }}"
        command: "{{ search_engine_install.services[0].configuration.plugins.list_command }}"
      register: installed_plugins

    - name: "workflows » neos » services » search_engine | install plugins defined in .valet-sh.yml"
      containers.podman.podman_container_exec:
        name: "vsh-{{ search_engine }}{{ search_engine_version }}"
        command: "{{ search_engine_install.services[0].configuration.plugins.install_command }} {{ current_plugin }}"
      with_items: "{{ search_engine_plugins }}"
      loop_control:
        loop_var: current_plugin
      when: current_plugin not in installed_plugins.stdout

    - name: "workflows » neos » services » search_engine | restart {{ search_engine }}{{ search_engine_version }} after plugin installation"
      ansible.builtin.systemd:
        name: "vsh-{{ search_engine }}{{ search_engine_version }}"
        state: restarted
        scope: user

    - name: "workflows » neos » services » elasticsearch | set 'valet_sh_neos_elasticsearch_version' var"
      ansible.builtin.set_fact:
        valet_sh_neos_elasticsearch_version: "{{ valet_sh_project_vars.services.elasticsearch.version }}"

  when:
    - current_os == "ubuntu"
    - search_engine is defined

- block:
    - name: "workflows » neos » services » search_engine | check if {{ search_engine }}{{ search_engine_version }} is installed"
      vsh_bundle_install_state_info:
        state: "present"
        name: "{{ search_engine }}{{ search_engine_version }}"
      register: search_engine_installed

    - name: "workflows » neos » services » search_engine | resolve {{ search_engine }}{{ search_engine_version }} service"
      vsh_bundle_resolver:
        name: "{{ search_engine }}{{ search_engine_version }}"
        current_os: "{{ current_os }}"
      register: search_engine_install

    - name: "workflows » neos » services » search_engine | read plugins from .valet-sh.yml"
      ansible.builtin.set_fact:
        search_engine_plugins: "{{ search_engine_config.plugins | default([]) }}"

    - name: "workflows » neos » services » search_engine | include service-specific roles"
      ansible.builtin.include_role:
        name: "{{ search_engine }}"
      vars:
        valet_resolved_service: "{{ search_engine_install }}"
        valet_install_services: ["{{ search_engine }}{{ search_engine_version }}"]
      when: search_engine_installed.kinds | length == 0

    - name: "workflows » neos » services » search_engine | ensure {{ search_engine }}{{ search_engine_version }} is started"
      apple_container:
        name: "vsh-{{ search_engine }}{{ search_engine_version }}"
        state: started

    - name: "workflows » neos » services » search_engine | set {{ search_engine }}{{ search_engine_version }} as enabled"
      vsh_bundle_state:
        action: "enabled"
        canonical_names: "{{ search_engine }}{{ search_engine_version }}"

    - name: "workflows » neos » services » search_engine | wait for {{ search_engine }}{{ search_engine_version }} to be reachable"
      ansible.builtin.wait_for:
        host: "vsh-{{ search_engine }}{{ search_engine_version }}"
        port: "{{ search_engine_install.services[0].configuration.ports.http }}"
        delay: 5

    - name: "workflows » neos » services » search_engine | check if plugins are already installed"
      apple_container_exec:
        name: "vsh-{{ search_engine }}{{ search_engine_version }}"
        command: "{{ search_engine_install.services[0].configuration.plugins.list_command }}"
      register: installed_plugins

    - name: "workflows » neos » services » search_engine | install plugins defined in .valet-sh.yml"
      apple_container_exec:
        name: "vsh-{{ search_engine }}{{ search_engine_version }}"
        command: "{{ search_engine_install.services[0].configuration.plugins.install_command }} {{ current_plugin }}"
      with_items: "{{ search_engine_plugins }}"
      loop_control:
        loop_var: current_plugin
      when: current_plugin not in installed_plugins.stdout_lines

    - name: "workflows » neos » services » search_engine | restart {{ search_engine }}{{ search_engine_version }} after plugin installation"
      apple_container:
        name: "vsh-{{ search_engine }}{{ search_engine_version }}"
        state: restarted

    - name: "workflows » neos » services » elasticsearch | set 'valet_sh_neos_elasticsearch_version' var"
      ansible.builtin.set_fact:
        valet_sh_neos_elasticsearch_version: "{{ valet_sh_project_vars.services.elasticsearch.version | int }}"

  when:
    - current_os == "mac"
    - search_engine is defined
