---

# TODO: Version currently needs to be set to '' meaning it will get the only specified
# version from the valet-service-new.yml file (3.12). Only needed when in the .valet-sh.yml
# a version is defined

- block:
    - name: "workflows » magento2 » services » rabbitmq | check if rabbitmq{{ valet_sh_project_vars.services.rabbitmq.version | default('') }} is installed"
      vsh_service_state:
        action: "is_installed"
        canonical_names: "rabbitmq{{ valet_sh_project_vars.services.rabbitmq.version | default('') }}"
      register: rabbitmq_installed

    - name: "workflows » magento2 » services » rabbitmq | resolve rabbitmq{{ valet_sh_project_vars.services.rabbitmq.version | default('') }} service"
      vsh_service_resolver:
        services: "rabbitmq{{ valet_sh_project_vars.services.rabbitmq.version | default('') }}"
        current_os: "{{ current_os }}"
      register: rabbitmq_install

    - name: "workflows » magento2 » services » rabbitmq | include valet-service role to set defaults"
      ansible.builtin.include_role:
        name: "valet-service"
        public: true
      vars:
        valet_sh_service_internal_action: true
        valet_service_action: "handle"
        valet_sh_newly_installed_services: "{{ rabbitmq_install }}"

    - name: "include service-specific roles"
      ansible.builtin.include_role:
        name: "rabbitmq"
        public: true
      vars:
        valet_resolved_service: "{{ rabbitmq_install }}"
        valet_install_services: ["rabbitmq{{ valet_sh_project_vars.services.rabbitmq.version | default('') }}"]
      when: not rabbitmq_installed.is_installed

    - name: "workflows » magento2 » services » rabbitmq | ensure rabbitmq is started"
      ansible.builtin.systemd:
        name: vsh-rabbitmq-server
        state: restarted
        enabled: true
        scope: user

    - name: "workflows » magento2 » services » rabbitmq | set rabbitmq as enabled"
      vsh_service_state:
        action: "set_enabled"
        canonical_names: "rabbitmq"

    - name: "workflows » magento2 » services » rabbitmq | wait for rabbitmq to be reachable"
      ansible.builtin.wait_for:
        port: 5672
        delay: 5

    - block:
        - name: "workflows » magento2 » services » rabbitmq | ensure rabbitmq vhost is absent"
          community.rabbitmq.rabbitmq_vhost:
            name: "{{ valet_sh_project_vars.services.rabbitmq.vhost }}"
            state: absent
            login_host: "localhost"
            login_user: "{{ valet_sh_service_rabbitmq_user }}"
            login_password: "{{ valet_sh_service_rabbitmq_password }}"

        - name: "workflows » magento2 » services » rabbitmq | ensure rabbitmq user is absent"
          community.rabbitmq.rabbitmq_user:
            user: "guest"
            password: "guest"
            vhost: "{{ valet_sh_project_vars.services.rabbitmq.vhost }}"
            tags: "administrator"
            state: absent
      when: valet_opt_flag_clean is defined and valet_opt_flag_clean|bool

    # TODO: Install pip package requests to runtime and
    # update runtime to Ansible 11.9.0 to be able to use the commmunity.rabbitmq module in
    # version 1.6.0 which allows setting login_host, login_user and login_password parameters which
    # allow us to not rely on the rabbitmqctl package being installed

    - name: "workflows » magento2 » services » rabbitmq | ensure rabbitmq vhost exists"
      community.rabbitmq.rabbitmq_vhost:
        name: "{{ valet_sh_project_vars.services.rabbitmq.vhost }}"
        state: present
        login_host: localhost
        login_user: guest
        login_password: guest
        login_port: 15672
      retries: 5
      delay: 3

    - name: "workflows » magento2 » services » rabbitmq | ensure rabbitmq user exists"
      community.rabbitmq.rabbitmq_user:
        user: "{{ valet_sh_service_rabbitmq_user }}"
        password: "{{ valet_sh_service_rabbitmq_password }}"
        vhost: "{{ valet_sh_project_vars.services.rabbitmq.vhost }}"
        tags: "administrator"
        configure_priv: .*
        read_priv: .*
        write_priv: .*
        state: present
        login_host: localhost
        login_user: guest
        login_password: guest
        login_port: 15672
      retries: 5
      delay: 3
  when:
    - current_os == "ubuntu"
    - valet_sh_project_vars.services is defined
    - valet_sh_project_vars.services.rabbitmq is defined
    - valet_sh_project_vars.services.rabbitmq.vhost is defined

- block:
    - name: "workflows » magento2 » services » rabbitmq | ensure rabbitmq is started"
      ansible.builtin.shell: "{{ valet_sh_homebrew_bin_x86 }} services start rabbitmq"
      when: current_arch != "arm64"

    - name: "workflows » magento2 » services » rabbitmq | ensure rabbitmq is started"
      ansible.builtin.shell: "{{ valet_sh_homebrew_bin_arm64 }} services start rabbitmq"
      when: current_arch == "arm64"

    - name: "workflows » magento2 » services » rabbitmq | include valet services file"
      ansible.builtin.include_vars:
        file: "{{ valet_etc_services_file }}"
        name: valet_sh_services_obj

    - name: "workflows » magento2 » services » rabbitmq | prepare new config element"
      ansible.builtin.set_fact:
        new_service_state_element:
          rabbitmq: true

    - name: "workflows » magento2 » services » rabbitmq | update service object"
      ansible.builtin.set_fact:
        valet_sh_services_updated_states: "{{ valet_sh_services_obj.states | combine(new_service_state_element) }}"

    - name: "workflows » magento2 » services » rabbitmq | merge objects"
      ansible.builtin.set_fact:
        valet_sh_services_obj:
          states: "{{ valet_sh_services_updated_states }}"
          defaults: "{{ valet_sh_services_obj.defaults }}"

    - name: "workflows » magento2 » services » rabbitmq | transform object into nice yaml output"
      ansible.builtin.set_fact:
        valet_etc_services_list: "{{ valet_sh_services_obj | to_nice_yaml(width=50, explicit_start=True, explicit_end=True) }}"

    - name: "workflows » magento2 » services » rabbitmq | write new services.yml file"
      ansible.builtin.copy:
        content: "{{ valet_etc_services_list }}"
        dest: "{{ valet_etc_services_file }}"

    - name: "workflows » magento2 » services » rabbitmq | wait for rabbitmq to be reachable"
      ansible.builtin.wait_for:
        port: 5672
        delay: 5

    - block:
        - name: "workflows » magento2 » services » rabbitmq | ensure rabbitmq vhost is absent"
          community.rabbitmq.rabbitmq_vhost:
            name: "{{ valet_sh_project_vars.services.rabbitmq.vhost }}"
            node: "rabbit@localhost"
            state: absent

        - name: "workflows » magento2 » services » rabbitmq | ensure rabbitmq user is absent"
          community.rabbitmq.rabbitmq_user:
            user: "{{ valet_sh_service_rabbitmq_user }}"
            password: "{{ valet_sh_service_rabbitmq_password }}"
            vhost: "{{ valet_sh_project_vars.services.rabbitmq.vhost }}"
            node: "rabbit@localhost"
            tags: "administrator"
            state: absent
      when: valet_opt_flag_clean is defined and valet_opt_flag_clean|bool

    - name: "workflows » magento2 » services » rabbitmq | ensure rabbitmq vhost exists"
      community.rabbitmq.rabbitmq_vhost:
        name: "{{ valet_sh_project_vars.services.rabbitmq.vhost }}"
        node: "rabbit@localhost"
        state: present

    - name: "workflows » magento2 » services » rabbitmq | ensure rabbitmq user exists"
      community.rabbitmq.rabbitmq_user:
        user: "{{ valet_sh_service_rabbitmq_user }}"
        password: "{{ valet_sh_service_rabbitmq_password }}"
        vhost: "{{ valet_sh_project_vars.services.rabbitmq.vhost }}"
        node: "rabbit@localhost"
        tags: "administrator"
        configure_priv: .*
        read_priv: .*
        write_priv: .*
        state: present
  when:
    - current_os == "mac"
    - valet_sh_project_vars.services is defined
    - valet_sh_project_vars.services.rabbitmq is defined
    - valet_sh_project_vars.services.rabbitmq.vhost is defined
