---

- name: "workflows » magento2 » services » rabbitmq | set var 'valet_sh_service_rabbitmq_current_name'"
  ansible.builtin.set_fact:
    valet_sh_service_rabbitmq_current_name: "rabbitmq{{ valet_sh_project_vars.services.rabbitmq.version | default(valet_sh_bundle_definitions.services.rabbitmq.default_version) | replace('.', '') }}"

- block:
    - name: "workflows » magento2 » services » rabbitmq | check if {{ valet_sh_service_rabbitmq_current_name }} is installed"
      vsh_bundle_install_state_info:
        state: "present"
        name: "{{ valet_sh_service_rabbitmq_current_name }}"
      register: rabbitmq_installed

    - name: "workflows » magento2 » services » rabbitmq | resolve {{ valet_sh_service_rabbitmq_current_name }} service"
      vsh_bundle_resolver:
        name: "{{ valet_sh_service_rabbitmq_current_name }}"
        current_os: "{{ current_os }}"
        rabbitmq_fact: "rabbitmq_service"

    - name: set_fact
      ansible.builtin.set_fact:
        rabbitmq_service: "{{ ansible_facts['rabbitmq_service']}}"

    - name: "workflows » magento2 » services » rabbitmq | include service-specific roles"
      ansible.builtin.include_role:
        name: "rabbitmq"
      vars:
        valet_resolved_service: "{{ rabbitmq_service }}"
        valet_install_services: ["{{ valet_sh_service_rabbitmq_current_name }}"]
      when: rabbitmq_installed.kinds | length == 0

    - name: "workflows » magento2 » services » rabbitmq | ensure rabbitmq is started"
      ansible.builtin.systemd:
        name: "vsh-{{ valet_sh_service_rabbitmq_current_name }}"
        state: restarted
        enabled: true
        scope: user

    - name: "workflows » magento2 » services » rabbitmq | set rabbitmq as enabled"
      vsh_bundle_state:
        action: "enabled"
        canonical_names: "{{ valet_sh_service_rabbitmq_current_name }}"

    - name: "workflows » magento2 » services » rabbitmq | wait for rabbitmq to be reachable"
      ansible.builtin.wait_for:
        port: "{{ rabbitmq_service.services[0].configuration.ports.http }}"
        delay: 5

    - block:
        - name: "workflows » magento2 » services » rabbitmq | ensure rabbitmq vhost is absent"
          community.rabbitmq.rabbitmq_vhost:
            name: "{{ valet_sh_project_vars.services.rabbitmq.vhost }}"
            state: absent
            login_host: "localhost"
            login_user: "{{ valet_sh_service_rabbitmq_user }}"
            login_password: "{{ valet_sh_service_rabbitmq_password }}"

        - name: "workflows » magento2 » services » rabbitmq | ensure rabbitmq user is absent"
          community.rabbitmq.rabbitmq_user:
            user: "guest"
            password: "guest"
            vhost: "{{ valet_sh_project_vars.services.rabbitmq.vhost }}"
            tags: "administrator"
            state: absent
      when: valet_opt_flag_clean is defined and valet_opt_flag_clean|bool

    - name: "workflows » magento2 » services » rabbitmq | ensure rabbitmq vhost exists"
      community.rabbitmq.rabbitmq_vhost:
        name: "{{ valet_sh_project_vars.services.rabbitmq.vhost }}"
        state: present
        login_host: localhost
        login_user: guest
        login_password: guest
        login_port: "{{ rabbitmq_service.services[0].configuration.ports.http }}"
      retries: 5
      delay: 3

    - name: "workflows » magento2 » services » rabbitmq | ensure rabbitmq user exists"
      community.rabbitmq.rabbitmq_user:
        user: "{{ valet_sh_service_rabbitmq_user }}"
        password: "{{ valet_sh_service_rabbitmq_password }}"
        vhost: "{{ valet_sh_project_vars.services.rabbitmq.vhost }}"
        tags: "administrator"
        configure_priv: .*
        read_priv: .*
        write_priv: .*
        state: present
        login_host: localhost
        login_user: guest
        login_password: guest
        login_port: "{{ rabbitmq_service.services[0].configuration.ports.http }}"
      retries: 5
      delay: 3
  when:
    - current_os == "ubuntu"
    - valet_sh_project_vars.services is defined
    - valet_sh_project_vars.services.rabbitmq is defined
    - valet_sh_project_vars.services.rabbitmq.vhost is defined

- block:
    - name: "workflows » magento2 » services » rabbitmq | check if {{ valet_sh_service_rabbitmq_current_name }} is installed"
      vsh_bundle_install_state_info:
        state: "present"
        name: "{{ valet_sh_service_rabbitmq_current_name }}"
      register: rabbitmq_installed

    - name: "workflows » magento2 » services » rabbitmq | resolve {{ valet_sh_service_rabbitmq_current_name }} service"
      vsh_bundle_resolver:
        name: "{{ valet_sh_service_rabbitmq_current_name }}"
        current_os: "{{ current_os }}"
        custom_fact: "rabbitmq_service"

    - name: set_fact
      ansible.builtin.set_fact:
        rabbitmq_service: "{{ ansible_facts['rabbitmq_service']}}"

    - name: "workflows » magento2 » services » rabbitmq | include service-specific roles"
      ansible.builtin.include_role:
        name: "rabbitmq"
      vars:
        valet_resolved_service: "{{ rabbitmq_service }}"
        valet_install_services: ["{{ valet_sh_service_rabbitmq_current_name }}"]
      when: rabbitmq_installed.kinds | length == 0

    - name: "workflows » magento2 » services » rabbitmq | ensure rabbitmq is started"
      apple_container:
        name: "vsh-{{ valet_sh_service_rabbitmq_current_name }}"
        state: started

    - name: "workflows » magento2 » services » rabbitmq | set rabbitmq as enabled"
      vsh_bundle_state:
        action: "enabled"
        canonical_names: "{{ valet_sh_service_rabbitmq_current_name }}"

    - name: "workflows » magento2 » services » rabbitmq | wait for rabbitmq to be reachable"
      ansible.builtin.wait_for:
        host: "vsh-{{ valet_sh_service_rabbitmq_current_name }}"
        port: "{{ rabbitmq_service.services[0].configuration.ports.http }}"
        delay: 5

    - block:
        - name: "workflows » magento2 » services » rabbitmq | ensure rabbitmq vhost is absent"
          community.rabbitmq.rabbitmq_vhost:
            name: "{{ valet_sh_project_vars.services.rabbitmq.vhost }}"
            node: "rabbit@localhost"
            state: absent
            login_host: "vsh-{{ valet_sh_service_rabbitmq_current_name }}"
            login_port: "{{ rabbitmq_service.services[0].configuration.ports.http }}"
            login_user: guest
            login_password: guest

        - name: "workflows » magento2 » services » rabbitmq | ensure rabbitmq user is absent"
          community.rabbitmq.rabbitmq_user:
            user: "{{ valet_sh_service_rabbitmq_user }}"
            password: "{{ valet_sh_service_rabbitmq_password }}"
            vhost: "{{ valet_sh_project_vars.services.rabbitmq.vhost }}"
            node: "rabbit@localhost"
            tags: "administrator"
            state: absent
            login_host: "vsh-{{ valet_sh_service_rabbitmq_current_name }}"
            login_port: "{{ rabbitmq_service.services[0].configuration.ports.http }}"
            login_user: guest
            login_password: guest
      when: valet_opt_flag_clean is defined and valet_opt_flag_clean|bool

    - name: "workflows » magento2 » services » rabbitmq | ensure rabbitmq vhost exists"
      community.rabbitmq.rabbitmq_vhost:
        name: "{{ valet_sh_project_vars.services.rabbitmq.vhost }}"
        node: "rabbit@localhost"
        state: present
        login_host: "vsh-{{ valet_sh_service_rabbitmq_current_name }}"
        login_port: "{{ rabbitmq_service.services[0].configuration.ports.http }}"
        login_user: guest
        login_password: guest

    - name: "workflows » magento2 » services » rabbitmq | ensure rabbitmq user exists"
      community.rabbitmq.rabbitmq_user:
        user: "{{ valet_sh_service_rabbitmq_user }}"
        password: "{{ valet_sh_service_rabbitmq_password }}"
        vhost: "{{ valet_sh_project_vars.services.rabbitmq.vhost }}"
        login_host: "vsh-{{ valet_sh_service_rabbitmq_current_name }}"
        login_port: "{{ rabbitmq_service.services[0].configuration.ports.http }}"
        login_user: guest
        login_password: guest
        node: "rabbit@localhost"
        tags: "administrator"
        configure_priv: .*
        read_priv: .*
        write_priv: .*
        state: present
  when:
    - current_os == "mac"
    - valet_sh_project_vars.services is defined
    - valet_sh_project_vars.services.rabbitmq is defined
    - valet_sh_project_vars.services.rabbitmq.vhost is defined
