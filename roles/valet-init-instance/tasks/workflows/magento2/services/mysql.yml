---

- block:
    - name: "workflows » magento2 » services » mysql | set var 'valet_sh_service_mysql_current_name'"
      ansible.builtin.set_fact:
        valet_sh_service_mysql_current_name: "mysql{{ valet_sh_project_vars.services.mysql.version | replace('.', '') }}"

    - name: "workflows » magento2 » services » mysql | check if mysql{{ valet_sh_project_vars.services.mysql.version | default() }} is installed"
      vsh_bundle_install_state_info:
        state: "present"
        name: "{{ valet_sh_service_mysql_current_name }}"
      register: mysql_installed

    - name: "workflows » magento2 » services » mysql | resolve mysql{{ valet_sh_project_vars.services.mysql.version | default() }} service"
      vsh_bundle_resolver:
        name: "{{ valet_sh_service_mysql_current_name }}"
        current_os: "{{ current_os }}"
      register: db_service

    - name: "include service-specific roles"
      ansible.builtin.include_role:
        name: "mysql-community-server"
      vars:
        valet_resolved_service: "{{ db_service }}"
        valet_install_services: ["{{ valet_sh_service_mysql_current_name }}"]
      when: mysql_installed.kinds | length == 0

    - name: "workflows » magento2 » services » mysql | ensure {{ valet_sh_service_mysql_current_name | default() }} is started"
      ansible.builtin.systemd:
        name: "vsh-{{ valet_sh_service_mysql_current_name }}"
        state: started
        enabled: true
        scope: user

    - name: "workflows » magento2 » services » mysql | set {{ valet_sh_service_mysql_current_name | default() }} as default"
      vsh_bundle_state:
        action: "default"
        name: "mysql"
        canonical_names: "{{ valet_sh_service_mysql_current_name }}"

    - name: "workflows » magento2 » services » mysql | set {{ valet_sh_service_mysql_current_name | default()}} as enabled"
      vsh_bundle_state:
        action: "enabled"
        canonical_names: "{{ valet_sh_service_mysql_current_name }}"

    - name: "workflows » magento2 » services » mysql | wait for mysql to be reachable"
      ansible.builtin.wait_for:
        port: "{{ db_service.services[0].configuration.ports.tcp }}"
        delay: 5
  when:
    - current_os == "ubuntu"
    - valet_sh_project_vars.services is defined
    - valet_sh_project_vars.services.mysql is defined
    - valet_sh_project_vars.services.mysql.version is defined

- block:
    - name: "workflows » magento2 » services » mariadb | set var 'valet_sh_service_mariadb_current_name'"
      ansible.builtin.set_fact:
        valet_sh_service_mariadb_current_name: "mariadb{{ valet_sh_project_vars.services.mariadb.version | replace('.', '') }}"

    - name: "workflows » magento2 » services » mariadb | check if mariadb{{ valet_sh_project_vars.services.mariadb.version | default() }} is installed"
      vsh_bundle_install_state_info:
        state: "present"
        name: "{{ valet_sh_service_mariadb_current_name }}"
      register: mariadb_installed

    - debug:
        msg: "{{ mariadb_installed }}"

    - name: "workflows » magento2 » services » mariadb | resolve mariadb{{ valet_sh_project_vars.services.mariadb.version | default() }} service"
      vsh_bundle_resolver:
        name: "{{ valet_sh_service_mariadb_current_name }}"
        current_os: "{{ current_os }}"
      register: db_service


    - debug:
        msg: "{{ db_service }}"

    - name: "include service-specific roles"
      ansible.builtin.include_role:
        name: "mariadb-server"
      vars:
        valet_resolved_service: "{{ db_service }}"
        valet_install_services: ["{{ valet_sh_service_mariadb_current_name }}"]
      when: mariadb_installed.kinds | length == 0

    - name: "workflows » magento2 » services » mariadb | ensure {{ valet_sh_service_mariadb_current_name | default() }} is started"
      ansible.builtin.systemd:
        name: "vsh-{{ valet_sh_service_mariadb_current_name }}"
        state: started
        enabled: true
        scope: user

    - name: "workflows » magento2 » services » mariadb | set {{ valet_sh_service_mariadb_current_name | default() }} as default"
      vsh_bundle_state:
        action: "default"
        name: "mariadb"
        canonical_names: "{{ valet_sh_service_mariadb_current_name }}"

    - name: "workflows » magento2 » services » mariadb | set {{ valet_sh_service_mariadb_current_name | default() }} as enabled"
      vsh_bundle_state:
        action: "enabled"
        canonical_names: "{{ valet_sh_service_mariadb_current_name }}"

    - name: "workflows » magento2 » services » mariadb | wait for mariadb to be reachable"
      ansible.builtin.wait_for:
        port: "{{ db_service.services[0].configuration.ports.tcp }}"
        delay: 5
  when:
    - current_os == "ubuntu"
    - valet_sh_project_vars.services is defined
    - valet_sh_project_vars.services.mariadb is defined
    - valet_sh_project_vars.services.mariadb.version is defined

- block:
    - name: "workflows » magento2 » services » mysql | set var 'valet_sh_service_mysql_current_name'"
      ansible.builtin.set_fact:
        valet_sh_service_mysql_current_name: "mysql{{ valet_sh_project_vars.services.mysql.version | replace('.', '') }}"

    - name: "workflows » magento2 » services » mysql | ensure mysql{{ valet_sh_project_vars.services.mysql.version }} is started"
      ansible.builtin.shell: "{{ valet_sh_homebrew_bin }} services start vsh-{{ valet_sh_service_mysql_current_name }}"

    - name: "workflows » magento2 » services » mysql | include valet services file"
      ansible.builtin.include_vars:
        file: "{{ valet_etc_services_file }}"
        name: valet_sh_services_obj

    - name: "workflows » magento2 » services » mysql | prepare new config element"
      ansible.builtin.set_fact:
        new_service_state_element: "{ '{{ valet_sh_service_mysql_current_name }}': true }"

    - name: "workflows » magento2 » services » mysql | update service object"
      ansible.builtin.set_fact:
        valet_sh_services_updated_states: "{{ valet_sh_services_obj.states | combine(new_service_state_element) }}"

    - name: "workflows » magento2 » services » mysql | merge objects"
      ansible.builtin.set_fact:
        valet_sh_services_obj:
          states: "{{ valet_sh_services_updated_states }}"
          defaults: "{{ valet_sh_services_obj.defaults }}"

    - name: "workflows » magento2 » services » mysql | transform object into nice yaml output"
      ansible.builtin.set_fact:
        valet_etc_services_list: "{{ valet_sh_services_obj | to_nice_yaml(width=50, explicit_start=True, explicit_end=True) }}"

    - name: "workflows » magento2 » services » mysql | write new services.yml file"
      ansible.builtin.copy:
        content: "{{ valet_etc_services_list }}"
        dest: "{{ valet_etc_services_file }}"

    - name: "workflows » magento2 » services » mysql | wait for mysql to be reachable"
      ansible.builtin.wait_for:
        port: "{{ db_service.services[0].configuration.ports.tcp }}"
        delay: 5
  when:
    - current_os == "mac"
    - valet_sh_project_vars.services is defined
    - valet_sh_project_vars.services.mysql is defined
    - valet_sh_project_vars.services.mysql.version is defined

- block:
    - name: "workflows » magento2 » services » mariadb | set var 'valet_sh_service_mariadb_current_name'"
      ansible.builtin.set_fact:
        valet_sh_service_mariadb_current_name: "mariadb{{ valet_sh_project_vars.services.mariadb.version | replace('.', '') }}"

    - name: "workflows » magento2 » services » mariadb | ensure mariadb{{ valet_sh_project_vars.services.mariadb.version }} is started"
      ansible.builtin.shell: "{{ valet_sh_homebrew_bin }} services start vsh-{{ valet_sh_service_mariadb_current_name }}"
    - name: "workflows » magento2 » services » mysql | include valet services file"
      ansible.builtin.include_vars:
        file: "{{ valet_etc_services_file }}"
        name: valet_sh_services_obj

    - name: "workflows » magento2 » services » mysql | prepare new config element"
      ansible.builtin.set_fact:
        new_service_state_element: "{ '{{ valet_sh_service_mariadb_current_name }}': true }"

    - name: "workflows » magento2 » services » mysql | update service object"
      ansible.builtin.set_fact:
        valet_sh_services_updated_states: "{{ valet_sh_services_obj.states | combine(new_service_state_element) }}"

    - name: "workflows » magento2 » services » mysql | merge objects"
      ansible.builtin.set_fact:
        valet_sh_services_obj:
          states: "{{ valet_sh_services_updated_states }}"
          defaults: "{{ valet_sh_services_obj.defaults }}"

    - name: "workflows » magento2 » services » mysql | transform object into nice yaml output"
      ansible.builtin.set_fact:
        valet_etc_services_list: "{{ valet_sh_services_obj | to_nice_yaml(width=50, explicit_start=True, explicit_end=True) }}"

    - name: "workflows » magento2 » services » mysql | write new services.yml file"
      ansible.builtin.copy:
        content: "{{ valet_etc_services_list }}"
        dest: "{{ valet_etc_services_file }}"

    - name: "workflows » magento2 » services » mariadb | wait for mariadb to be reachable"
      ansible.builtin.wait_for:
        port: "{{ db_service.services[0].configuration.ports.tcp }}"
        delay: 5
  when:
    - current_os == "mac"
    - valet_sh_project_vars.services is defined
    - valet_sh_project_vars.services.mariadb is defined
    - valet_sh_project_vars.services.mariadb.version is defined
