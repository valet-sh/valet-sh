---
- name: "partials » load-project-workflow | fail when project_type was not found"
  ansible.builtin.fail:
    msg: "could not find project_type"
  when: valet_sh_project_vars.instance.type is not defined

# - include_tasks: "workflows/magento1/main.yml"
#   when: valet_sh_project_vars.instance.type == "magento1"

- ansible.builtin.include_tasks: "workflows/magento2/main.yml"
  when: valet_sh_project_vars.instance.type == "magento2"

- ansible.builtin.include_tasks: "workflows/neos/main.yml"
  when: valet_sh_project_vars.instance.type == "neos"

- ansible.builtin.include_tasks: "workflows/aem/main.yml"
  when: valet_sh_project_vars.instance.type == "aem"

- name: "partials » load-project-workflow | fail when no project workflow was included"
  ansible.builtin.fail:
    msg: "could not include project workflow for type '{{ valet_sh_project_vars.instance.type }}'"
  when: >
    (valet_sh_project_vars.instance.type != "magento2" and
     valet_sh_project_vars.instance.type != "neos" and
     valet_sh_project_vars.instance.type != "aem") or
    (valet_sh_project_vars.instance.type is not defined)
