---

- name: Ensure that rabbitmq container is stopped
  ansible.builtin.systemd:
    name: "{{ current_service.service.name }}"
    state: stopped
    daemon_reload: true
    scope: "{{ current_service.service.scope }}"
  ignore_errors: true

- name: Remove rabbitmq container
  containers.podman.podman_container:
    name: "vsh-{{ current_service.canonical }}"
    state: absent

- name: Remove rabbitmq volume
  containers.podman.podman_volume:
    name: "vsh-{{ current_service.canonical }}"
    state: absent
  when: "'--purge' in valet_cli_opts"

- name: Remove rabbitmq systemd service
  ansible.builtin.file:
    path: "{{ current_home }}/.config/systemd/user/{{ current_service.service.name }}.service"
    state: absent

- name: "Remove {{ current_service.service.name }} default.target.wants symlink"
  ansible.builtin.file:
    path: "{{ current_home }}/.config/systemd/user/default.target.wants/{{ current_service.service.name }}.service"
    state: absent

- name: "Remove {{ current_service.service.name }} vhost configuration for rabbitmq management plugin"
  ansible.builtin.file:
    path: "/etc/nginx/conf.d/{{ current_service.canonical }}.conf"
    state: absent
  become: true

- name: "Remove vsh-{{ current_service.canonical }} wrapper scripts"
  ansible.builtin.file:
    path: "/usr/local/bin/rabbitmqctl{{ current_service.version }}"
    state: absent
  become: true

- name: Remove rabbitmq image
  containers.podman.podman_image:
    name: "{{ current_service.configuration.docker_image }}"
    state: absent
    force: true
  when: "'--purge' in valet_cli_opts"

- name: "Remove vsh-{{ current_service.canonical }} from installed services"
  vsh_bundle_state:
    action: "uninstalled"
    canonical_names: "{{ current_service.canonical }}"
