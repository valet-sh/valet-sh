---

- name: "set handler_current_service fact"
  ansible.builtin.set_fact:
    handler_current_service: "{{ current_service }}"

- name: "Pull rabbitmq-server {{ current_service.service.version }} image"
  containers.podman.podman_image:
    name: "{{ current_service.configuration.docker_image }}"
    pull: true
    state: present
    force: true

- name: "Provide systemd service for {{ current_service.service.name }} container"
  ansible.builtin.template:
    src: "systemd/{{ current_service.name }}.service.j2"
    dest: "{{ current_home }}/.config/systemd/user/{{ current_service.service.name }}.service"
    owner: "{{ current_user }}"
    group: "{{ current_group }}"
    mode: "0644"
  notify: "systemd | vsh-rabbitmq | restarted"

- name: "Create {{ current_service.canonical }} config directory"
  ansible.builtin.file:
    path: "{{ current_service.configuration.base_path }}/config"
    owner: "{{ current_user }}"
    group: "{{ current_group }}"
    mode: "0755"
    state: directory

- name: "provide {{ current_service.service.name }} configuration"
  ansible.builtin.template:
    src: "{{ current_service.name }}.conf.j2"
    dest: "{{ current_service.configuration.base_path }}/config/{{ current_service.name }}.conf"
    mode: "0644"
  notify: "systemd | vsh-rabbitmq | restarted"

- name: "provide {{ current_service.service.name }} plugin configuration"
  ansible.builtin.copy:
    content: |
      [rabbitmq_management].
    dest: "{{ current_service.configuration.base_path }}/config/enabled_plugins"
    mode: "0644"
  notify: "systemd | vsh-rabbitmq | restarted"

- name: set 'cert_prefix' variable
  ansible.builtin.set_fact:
    cert_prefix: "{{ current_service.canonical }}"

- name: "generate ssl-certificate for {{ current_service.canonical }}.{{ development_tld }}"
  ansible.builtin.include_role:
    name: certificate
    public: true

- name: provide nginx vhost configuration for rabbitmq management plugin
  ansible.builtin.template:
    src: "nginx/{{ current_service.name }}.conf.j2"
    dest: "/etc/nginx/conf.d/{{ current_service.canonical }}.conf"
    owner: root
    group: root
    mode: "0644"
  notify: systemd | vsh-nginx | reloaded
  become: true

- name: unset 'cert_prefix' variable
  ansible.builtin.set_fact:
    cert_prefix: "{{ non_existent | default(None) }}"

- name: "Flush handlers"
  ansible.builtin.meta: flush_handlers

- name: "Get desired state of {{ current_service.service.name }} from services file"
  vsh_bundle_service_state_info:
    name: "{{ current_service.canonical }}"
  register: current_service_state

- name: "If desired state is unknown, set it to enabled"
  vsh_bundle_state:
    action: "initialize_empty"
    canonical_names: "{{ current_service.canonical }}"
  when: current_service_state.state == "unknown"

- name: "Update current_service_state after initialization"
  ansible.builtin.set_fact:
    current_service_state: "{{ current_service_state | combine({'state': 'enabled'}) }}"
  when: current_service_state.state == "unknown"

- name: "Set {{ current_service.service.name }} container state"
  ansible.builtin.systemd:
    name: "{{ current_service.service.name }}"
    state: "{{ 'started' if current_service_state.state == 'enabled' else 'stopped' }}"
    enabled: "{{ 'true' if current_service_state.state == 'enabled' else 'false' }}"
    scope: "{{ current_service.service.scope }}"

- name: "Mark {{ current_service.service.name }} as installed in the services file"
  vsh_bundle_state:
    action: "installed"
    canonical_names: "{{ current_service.canonical }}"
