---

- name: Pull rabbitmq-server image
  containers.podman.podman_image:
    name: "{{ current_rabbitmq_service.configuration.docker_image }}"
    pull: true
    state: present

- name: "ensure user systemd directory exists"
  ansible.builtin.file:
    path: "{{ current_home }}/.config/systemd/user"
    state: directory
    mode: "0755"

- name: Provide systemd service for vsh-rabbitmq-server container
  ansible.builtin.template:
    src: "systemd/rabbitmq-server.service.j2"
    dest: "{{ current_home }}/.config/systemd/user/{{ current_rabbitmq_service.service.name }}.service"
    owner: "{{ current_user }}"
    group: "{{ current_group }}"
    mode: "0644"
  notify: "systemd | vsh-rabbitmq-server | restarted"

- name: ensure vsh-rabbitmq-server is running and enabled
  ansible.builtin.systemd:
    name: "{{ current_rabbitmq_service.service.name }}"
    state: started
    enabled: true
    scope: "{{ current_rabbitmq_service.service.scope }}"

- name: set 'cert_prefix' variable
  ansible.builtin.set_fact:
    cert_prefix: "rabbitmq"

- name: "generate ssl-certificate for rabbitmq.{{ development_tld }}"
  ansible.builtin.include_role:
    name: certificate
    public: true

- name: provide nginx vhost configuration for rabbitmq management plugin
  ansible.builtin.template:
    src: "rabbitmq.conf.j2"
    dest: "/etc/nginx/conf.d/rabbitmq.conf"
    owner: root
    group: root
    mode: "0644"
  notify: systemd | nginx | reloaded
  become: true

- name: unset 'cert_prefix' variable
  ansible.builtin.set_fact:
    cert_prefix: "{{ non_existent | default(None) }}"
