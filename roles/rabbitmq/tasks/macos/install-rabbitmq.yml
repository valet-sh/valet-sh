---

- name: "set handler_current_service fact"
  ansible.builtin.set_fact:
    handler_current_service: "{{ current_service }}"

- name: Pull rabbitmq-server {{ current_service.version }} image
  apple_image:
    name: "{{ current_service.configuration.docker_image }}"
    pull: true
    state: present

- name: "ensure volume 'vsh-{{ current_service.canonical }}-data' exists"
  apple_volume:
    name: "vsh-{{ current_service.canonical }}-data"
    state: present
  register: data_volume_obj

- name: "fix volume permissions for 'vsh-{{ current_service.canonical }}-data'"
  apple_container:
    name: vsh-volume-fix
    image: alpine
    state: started
    remove: true
    detach: false
    volumes:
      - "vsh-{{ current_service.canonical }}-data:/data"
    command:
      - chown
      - -R
      - "1000:"
      - /data
  when: data_volume_obj.changed

- name: "Create vsh-{{ current_service.canonical }} config directory"
  ansible.builtin.file:
    path: "{{ current_service.configuration.base_path }}/config"
    owner: "{{ current_user }}"
    group: "{{ current_group }}"
    mode: "0755"
    state: directory

- name: "provide vsh-{{ current_service.canonical }} configuration"
  ansible.builtin.template:
    src: "{{ current_service.name }}.conf.j2"
    dest: "{{ current_service.configuration.base_path }}/config/{{ current_service.name }}.conf"
    mode: "0644"
  notify: "container | vsh-rabbitmq | restarted"

- name: set 'cert_prefix' variable
  ansible.builtin.set_fact:
    cert_prefix: "{{ current_service.canonical }}"

- name: "generate ssl-certificate for {{ current_service.canonical }}.{{ development_tld }}"
  ansible.builtin.include_role:
    name: certificate
    public: true

- name: provide nginx vhost configuration for rabbitmq management plugin
  ansible.builtin.template:
    src: "nginx/{{ current_service.name }}.conf.j2"
    dest: "/opt/homebrew/etc/nginx/conf.d/{{ current_service.canonical }}.conf"
    mode: "0644"
  notify: brew | nginx | reloaded
  become: true

- name: unset 'cert_prefix' variable
  ansible.builtin.set_fact:
    cert_prefix: "{{ non_existent | default(None) }}"

- name: "ensure container 'vsh-{{ current_service.canonical }}' is started"
  apple_container:
    name: "vsh-{{ current_service.canonical }}"
    image: "{{ current_service.configuration.docker_image }}"
    state: started
    cpus: "{{ current_service.configuration.limits.cpus | default(2) }}"
    memory: "{{ current_service.configuration.limits.memory | default('2g') }}"
    user: "1000:1000"
    volumes:
      - "vsh-{{ current_service.canonical }}-data:/var/lib/rabbitmq"
      - "{{ current_service.configuration.base_path }}/config/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:Z"

- name: "Flush handlers"
  ansible.builtin.meta: flush_handlers

- name: "Get desired state of vsh-{{ current_service.canonical }} from services file"
  vsh_bundle_service_state_info:
    name: "{{ current_service.canonical }}"
  register: current_service_state

- name: "If desired state is unknown, set it to enabled"
  vsh_bundle_state:
    action: "initialize_empty"
    canonical_names: "{{ current_service.canonical }}"
  when: current_service_state.state == "unknown"

- name: "Update current_service_state after initialization"
  ansible.builtin.set_fact:
    current_service_state: "{{ current_service_state | combine({'state': 'enabled'}) }}"
  when: current_service_state.state == "unknown"

- name: "Ensure target state of vsh-{{ current_service.canonical }} is set"
  apple_container:
    name: "vsh-{{ current_service.canonical }}"
    state: "{{ 'started' if current_service_state.state == 'enabled' else 'stopped' }}"

- name: Set container autostart
  ansible.builtin.lineinfile:
    path: /usr/local/valet-sh/etc/container-autostart
    line: "vsh-{{ current_service.canonical }}"
    state: "{{ 'present' if current_service_state.state == 'enabled' else 'absent' }}"

- name: "Mark vsh-{{ current_service.canonical }} as installed in the services file"
  vsh_bundle_state:
    action: "installed"
    canonical_names: "{{ current_service.canonical }}"
