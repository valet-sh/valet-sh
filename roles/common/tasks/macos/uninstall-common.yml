---

- name: set max_map_count to 262144
  ansible.posix.sysctl:
    name: vm.max_map_count
    value: "262144"
    state: present
    reload: false
  become: true

- name: set fs.inotify.max_user_watches to 1048576
  ansible.posix.sysctl:
    name: fs.inotify.max_user_watches
    value: "1048576"
    state: present
    reload: false
  become: true

- name: "ensure brew_x86 wrapper script is removed (on apple silicon)"
  file:
    path: /usr/local/bin/brew_x86
    state: absent

- name: "ensure '{{ current_home }}/Library/LaunchAgents' exists"
  file:
    path: "{{ current_home }}/Library/LaunchAgents"
    state: directory
    mode: '0755'

- name: ensure homebrew is installed
  ansible.builtin.shell: '/bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/master/install.sh)"'
  args:
    creates: "/opt/homebrew/bin/brew"

- name: Ensure valet-sh/php is tapped
  ansible.builtin.shell: "{{ valet_sh_homebrew_bin }} tap valet-sh/php"

- name: Ensure valet-sh/php is trusted
  ansible.builtin.shell: "{{ valet_sh_homebrew_bin }} trust valet-sh/php"

- name: ensure LaunchDaemons script for maxfiles limit is deployed
  ansible.builtin.template:
    src: "limit.maxfiles.conf.j2"
    dest: "/Library/LaunchDaemons/limit.maxfiles.plist"
  become: true

- name: ensure maxfile limit daemon is started
  ansible.builtin.shell: "launchctl load -w /Library/LaunchDaemons/limit.maxfiles.plist"

- name: ensure service tap is installed
  ansible.builtin.shell: "{{ valet_sh_homebrew_bin }} services list"
