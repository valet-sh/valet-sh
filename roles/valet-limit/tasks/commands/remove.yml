---

- name: "limit » get | Set service variable from argument"
  ansible.builtin.set_fact:
    valet_limit_service: "{{ cli.args[2] }}"

- name: "limit » remove | Fail when key is not supported"
  ansible.builtin.fail:
    msg: "Key '{{ valet_limit_key }}' does not exist. Supported keys are: cpus, memory, all"
  when: valet_limit_key not in ["cpus", "memory", "all"]

- name: "limit » remove | Check if supplied service exists"
  vsh_bundle_resolver:
    name: "{{ valet_limit_service }}"
    current_os: "{{ current_os }}"
  register: vsh_resolver

- name: "limit » remove | Define target file path"
  ansible.builtin.set_fact:
    target_overwrite_file: "{{ valet_overwrites_path }}/{{ vsh_resolver.services[0].name }}/{{ vsh_resolver.services[0].version }}.yml"

- name: "limit » remove | Check if overwrite file exists"
  ansible.builtin.stat:
    path: "{{ target_overwrite_file }}"
  register: overwrite_file_stat

- name: "limit » remove | Fail if overwrite file does not exist"
  ansible.builtin.fail:
    msg: "No overwrite file found for service '{{ valet_limit_service }}'. Cannot remove limit '{{ valet_limit_key }}'."
  when: not overwrite_file_stat.stat.exists

- name: "limit » remove | Remove overwrite file when 'all' is specified"
  ansible.builtin.file:
    path: "{{ target_overwrite_file }}"
    state: absent
  when: valet_limit_key == "all" and overwrite_file_stat.stat.exists

- name: "limit » remove | Read existing configuration"
  ansible.builtin.slurp:
    src: "{{ target_overwrite_file }}"
  register: existing_overwrite_file
  when: valet_limit_key != "all" and overwrite_file_stat.stat.exists

- name: "limit » remove | Parse existing configuration"
  ansible.builtin.set_fact:
    existing_config: "{{ (existing_overwrite_file.content | b64decode | from_yaml) if (existing_overwrite_file.content is defined) else {} }}"
  when: valet_limit_key != "all"

- name: "limit » remove | Filter out target key from limits dictionary"
  ansible.builtin.set_fact:
    updated_limits: "{{ (existing_config.configuration.limits | default({})) | dict2items | rejectattr('key', 'equalto', valet_limit_key) | items2dict }}"
  when: valet_limit_key != "all"

- name: "limit » remove | Write updated configuration"
  ansible.builtin.template:
    src: "templates/limit.yml.j2"
    dest: "{{ target_overwrite_file }}"
    owner: "{{ current_user }}"
    group: "{{ current_group }}"
    mode: "0644"
  vars:
    merged_limits: "{{ updated_limits | default({}) }}"
  when:
    - valet_limit_key != "all"
    - updated_limits is defined
    - updated_limits | length > 0

- name: "limit » remove | Delete overwrite file if no limits remain"
  ansible.builtin.file:
    path: "{{ target_overwrite_file }}"
    state: absent
  when:
    - valet_limit_key != "all"
    - updated_limits is defined
    - updated_limits | length == 0
