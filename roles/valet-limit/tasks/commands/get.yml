---

- name: "limit » get | Set service variable from argument"
  ansible.builtin.set_fact:
    valet_limit_service: "{{ cli.args[1] }}"

- name: "limit » get | Check if supplied service exists"
  vsh_bundle_resolver:
    name: "{{ valet_limit_service }}"
    current_os: "{{ current_os }}"
  register: vsh_resolver

- name: "limit » get | Define target file path"
  ansible.builtin.set_fact:
    target_overwrite_file: "{{ valet_overwrites_path }}/{{ vsh_resolver.services[0].name }}/{{ vsh_resolver.services[0].version }}.yml"

- name: "limit » get | Check if overwrite file exists"
  ansible.builtin.stat:
    path: "{{ target_overwrite_file }}"
  register: overwrite_file_stat

- name: "limit » get | Fail if overwrite file does not exist"
  ansible.builtin.fail:
    msg: "No overwrite file found for service '{{ valet_limit_service }}'."
  when: not overwrite_file_stat.stat.exists

- name: "limit » get | Read existing configuration if present"
  ansible.builtin.slurp:
    src: "{{ target_overwrite_file }}"
  register: existing_overwrite_file
  when: overwrite_file_stat.stat.exists

- name: "limit » get | Parse existing configuration"
  ansible.builtin.set_fact:
    existing_config: "{{ (existing_overwrite_file.content | b64decode | from_yaml) if existing_overwrite_file.content is defined else {} }}"

- name: "limit » get | Extract limits dictionary"
  ansible.builtin.set_fact:
    active_limits: "{{ existing_config.configuration.limits | default({}) }}"

- name: "limit » get | Format headers and row for table rendering"
  ansible.builtin.set_fact:
    table_headers: "{{ active_limits.keys() | list }}"
    table_rows:
      - "{{ active_limits.values() | list }}"
  when: active_limits | length > 0

- name: "limit » get | Print limits table"
  vsh-table:
    headers: "{{ table_headers }}"
    rows: "{{ table_rows }}"
  when: active_limits | length > 0
