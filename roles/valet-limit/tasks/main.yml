---

- name: "Fail when current_os is not supported"
  ansible.builtin.fail:
    msg: "Current OS '{{ current_os }}' is not supported for valet.sh limit command"
  when: current_os == "ubuntu"

- ansible.builtin.include_tasks: "commands/set.yml"
  when: valet_limit_action == "set"

- ansible.builtin.include_tasks: "commands/get.yml"
  when: valet_limit_action == "get"

- ansible.builtin.include_tasks: "commands/remove.yml"
  when: valet_limit_action == "remove"
