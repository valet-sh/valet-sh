[defaults]
nocows = 1
inventory = inventory
roles_path = roles
collections_path = collections
retry_files_enabled = False

# http://docs.ansible.com/ansible/intro_configuration.html#callback-plugins
callback_plugins = ./plugins/callback

# http://docs.ansible.com/ansible/intro_configuration.html#action-plugins
action_plugins = ./plugins/action

# http://docs.ansible.com/ansible/intro_configuration.html#stdout-callback
# ansible.posix.jsonl streams one JSON object per line for each Ansible event.
# The Go CLI reads this structured output instead of parsing ANSI escape codes.
stdout_callback = ansible.posix.jsonl

# No notification callbacks needed — debug.log is no longer used.
# valet-sh.py remains on disk but is not loaded.
# callbacks_enabled =

gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible-facts
